# Builds an installable Android APK on every push to main and publishes it as the
# "Android app" release, so the latest build is always at:
# https://github.com/dalecri/Twostorycaptions/releases/latest/download/TwoStoryCaptions.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app and sync into Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TwoStoryCaptions.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TwoStoryCaptions.apk \
            --title "Android app (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. On your phone, open this page, download TwoStoryCaptions.apk and install it. It updates over the previous install, keeping your data." \
            --latest
