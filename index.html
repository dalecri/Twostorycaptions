<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TwoStoryCaptions">
<meta name="theme-color" content="#6E1E3A">
<title>TwoStoryCaptions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE8D8;
    --paper-light: #F8F4EA;
    --ink: #2B3532;
    --ink-soft: #565f56;
    --moss: #6B7A5E;
    --moss-dark: #4d5943;
    --rust: #A6544A;
    --line: #cdc2a4;
    --stamp-idea: #8a8478;
    --stamp-filmed: #7c8a6a;
    --stamp-captioned: #b08a4a;
    --stamp-scheduled: #4a7a8a;
    --stamp-posted: #4d5943;
    --spark: #C98A2E;
    --spark-dark: #A66F1F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  header.masthead .title-block h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 24px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header.masthead .title-block p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin: 6px 0 0;
  }
  header.masthead .catalog-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .entry-form {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 30px;
    position: relative;
  }
  .entry-form::before {
    content: "NEW CAPTION";
    position: absolute;
    top: -10px;
    left: 20px;
    background: var(--paper);
    padding: 0 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--moss-dark);
  }
  .entry-form textarea, .entry-form select {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 10px;
    resize: vertical;
  }
  .field-group { margin: 16px 0; }
  .field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-light);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  button:hover { background: var(--moss-dark); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  button.ghost:hover { background: var(--ink); color: var(--paper-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ===== Date pill (shared design: new-caption form + card) ===== */
  .date-pill-row { display: flex; align-items: center; gap: 8px; }
  .date-pill-row input[type="date"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
  }
  .date-pill-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .date-pill-btn:hover { border-color: var(--stamp-scheduled); color: var(--stamp-scheduled); transform: none; }
  .date-pill-btn.confirmed {
    border: 1px solid var(--stamp-scheduled);
    color: var(--stamp-scheduled);
    background: color-mix(in srgb, var(--stamp-scheduled) 8%, transparent);
  }
  .date-pill-clear {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 6px 8px;
    opacity: 0.6;
  }
  .date-pill-clear:hover { opacity: 1; background: transparent; transform: none; }

  /* ===== Minimal dropdown filter ===== */
  .filter-row { margin-bottom: 18px; }
  #filterSelect {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper-light);
    color: var(--ink);
  }

  /* ===== Cards: simplified ===== */
  .card {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .card-top-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .trash-btn {
    background: transparent;
    border: none;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0.55;
  }
  .trash-btn:hover { opacity: 1; }
  .expand-toggle-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 11px;
    line-height: 1;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .expand-toggle-btn:hover { border-color: var(--moss); color: var(--moss); }
  .card.card-compact { padding-bottom: 16px; }
  .card.card-compact .card-top { margin-bottom: 0; }
  .card.card-compact .card-desc { font-size: 15px; }
  .captions-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--moss-dark);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 0 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .captions-toggle:hover { text-decoration: underline; }
  .card-desc {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
  }
  .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border: none;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    background: color-mix(in srgb, currentColor 16%, var(--paper-light));
  }
  .stamp.idea { color: var(--stamp-idea); }
  .stamp.filmed { color: var(--stamp-filmed); }
  .stamp.captioned { color: var(--stamp-captioned); }
  .stamp.scheduled { color: var(--stamp-scheduled); }
  .stamp.posted { color: var(--stamp-posted); }

  .card-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .card-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .card-actions select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .card-actions button { padding: 6px 10px; font-size: 10.5px; }
  .gen-caption-btn {
    background: var(--spark);
    color: #fff;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 11.5px;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .gen-caption-btn:hover { background: var(--spark-dark); }
  .gen-caption-btn:disabled { background: var(--spark); opacity: 0.75; }
  .remove-btn {
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
  }
  .remove-btn:hover { background: var(--rust); color: #fff; }

  .captions-box {
    margin-top: 14px;
    border-top: 1px dashed var(--line);
    padding-top: 16px;
  }
  .caption-opt {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .caption-opt-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .caption-opt .copy-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--moss-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .copy-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--moss);
    background: transparent;
    color: var(--moss-dark);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.12s ease;
  }
  .copy-btn:hover { background: var(--moss); color: #fff; }
  .copy-btn.just-copied { background: var(--moss); color: #fff; border-color: var(--moss); }
  .hook-line { font-style: normal; font-weight: 600; color: var(--moss-dark); }
  .hashtags-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  .hashtags { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); flex: 1; }

  .tone-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tone-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tone-chip:hover { border-color: var(--moss); }
  .tone-chip.selected { background: var(--moss); border-color: var(--moss); color: #fff; }

  .platform-row {
    display: inline-flex;
    gap: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .platform-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .platform-chip:hover { background: color-mix(in srgb, var(--rust) 10%, transparent); }
  .platform-chip.selected { background: var(--rust); color: #fff; }

  /* ===== View toggle (icon-only) ===== */
  .view-toggle {
    display: inline-flex;
    width: fit-content;
    max-width: 100%;
    gap: 0;
    margin-bottom: 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .view-toggle button {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    padding: 8px 14px;
    font-size: 15px;
  }
  .view-toggle button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); transform: none; }
  .view-toggle button.active { background: var(--moss); color: #fff; }
  .view-toggle button.active:hover { background: var(--moss); }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-header h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
  }
  .cal-header .nav-btns { display: flex; gap: 8px; }
  .cal-header .nav-btns button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 5px 12px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: auto repeat(var(--cal-weeks, 5), 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .cal-dow {
    background: var(--ink);
    color: var(--paper-light);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    padding: 6px 2px;
  }
  .cal-cell {
    background: var(--paper-light);
    min-height: 70px;
    padding: 6px;
    position: relative;
    overflow: hidden;
  }
  .cal-cell.empty { background: var(--paper); }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--moss); }
  .cal-daynum {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .cal-post {
    font-size: 10.5px;
    line-height: 1.3;
    background: #fff;
    border-left: 3px solid var(--moss);
    padding: 3px 5px;
    margin-bottom: 3px;
    cursor: pointer;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cal-post.posted { border-left-color: var(--stamp-posted); opacity: 0.7; }
  .cal-post.scheduled { border-left-color: var(--stamp-scheduled); }
  .cal-post.captioned { border-left-color: var(--stamp-captioned); }

  .theme-picker { position: relative; }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-light);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 7px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .theme-btn:hover { background: var(--ink); color: var(--paper-light); }
  .theme-swatch-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15) inset;
  }
  .theme-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--paper-light);
    border: 1px solid var(--ink);
    width: 250px;
    z-index: 200;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.08);
  }
  .theme-dropdown.open { display: block; }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .theme-option:last-child { border-bottom: none; }
  .theme-option:hover { background: var(--paper); }
  .theme-option.selected { background: var(--paper); font-weight: 600; }
  .theme-swatch-pair {
    display: flex;
    width: 32px;
    height: 20px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }
  .theme-swatch-pair div { flex: 1; }
  .theme-option-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink);
  }

  .cardlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
    align-items: stretch;
  }
  .grid-tile {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 12px;
    aspect-ratio: 1 / 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .grid-tile:hover { transform: translateY(-2px); }
  .grid-tile-desc {
    font-size: 13px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 8px 0;
  }
  .grid-tile-footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }

  /* ===== Mobile "notes app" list ===== */
  .note-list { border-top: 1px solid var(--line); }
  .note-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .note-row:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .note-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .note-dot.idea { background: var(--stamp-idea); }
  .note-dot.filmed { background: var(--stamp-filmed); }
  .note-dot.captioned { background: var(--stamp-captioned); }
  .note-dot.scheduled { background: var(--stamp-scheduled); }
  .note-dot.posted { background: var(--stamp-posted); }
  .note-title {
    flex: 1;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-chevron { color: var(--ink-soft); font-size: 16px; flex-shrink: 0; }

  @media (max-width: 900px) {
    .cardlist-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .grid-tile-desc { font-size: 12px; -webkit-line-clamp: 4; }
  }
  @media (max-width: 560px) {
    .cardlist-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-tile { padding: 9px; }
    .grid-tile-desc { font-size: 11.5px; -webkit-line-clamp: 4; margin: 6px 0; }
    .grid-tile-footer { font-size: 8.5px; }
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--paper-light);
    border: 1px solid var(--ink);
    border-radius: 20px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 50px 26px 26px;
    position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  .modal-box .card { border: none; border-radius: 0; padding: 0; margin: 0; }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    z-index: 2;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
  }
  .spinner {
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 2px solid color-mix(in srgb, currentColor 30%, transparent);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer.tally {
    margin-top: 30px;
    border-top: 2px solid var(--ink);
    padding-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
  }

  /* Fullscreen calendar mode: mobile only (see media query below) */
  .bottom-tab-bar, .fab-add, .sheet-header, .sheet-backdrop { display: none; }

  @media (max-width: 820px) {
    body { padding: 24px 16px 60px; }
    header.masthead { flex-wrap: wrap; gap: 12px; }
    .card-actions { row-gap: 8px; }
  }

  @media (max-width: 600px) {
    body { padding: calc(16px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom)); }
    .wrap { max-width: 100%; }

    body.view-calendar-full {
      padding: env(safe-area-inset-top) 0 0 0 !important;
      display: flex !important;
      flex-direction: column !important;

function applyTheme(name, skipSave) {
  currentTheme = name;
  const theme = THEMES[name];
  const root = document.documentElement.style;
  Object.entries(theme.vars).forEach(([k, v]) => root.setProperty(k, v));
  document.getElementById('themeBtnDot').style.background = theme.swatches[1];
  renderThemeDropdown();
  if (!skipSave) {
    try { localStorage.setItem('ttt-theme', name); } catch (e) {}
  }
}

function renderThemeDropdown() {
  const dd = document.getElementById('themeDropdown');
  dd.innerHTML = '';
  Object.entries(THEMES).forEach(([key, theme]) => {
    const opt = document.createElement('div');
    opt.className = 'theme-option' + (currentTheme === key ? ' selected' : '');
    const pair = document.createElement('div');
    pair.className = 'theme-swatch-pair';
    theme.swatches.forEach(c => {
      const half = document.createElement('div');
      half.style.background = c;
      pair.appendChild(half);
    });
    const label = document.createElement('div');
    label.className = 'theme-option-label';
    label.textContent = theme.label;
    opt.appendChild(pair);
    opt.appendChild(label);
    opt.onclick = () => { applyTheme(key); document.getElementById('themeDropdown').classList.remove('open'); };
    dd.appendChild(opt);
  });
}

document.getElementById('themeBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('themeDropdown').classList.toggle('open');
});
document.addEventListener('click', () => {
  document.getElementById('themeDropdown').classList.remove('open');
});

let newClipPlatform = 'Both';
let newClipDate = '';
let newClipDateEditing = false;

function renderNewClipDateRow() {
  const row = document.getElementById('newClipDateRow');
  row.innerHTML = '';
  if (newClipDateEditing) {
    const input = document.createElement('input');
    input.type = 'date';
    input.value = newClipDate;
    input.autofocus = true;
    input.onchange = () => { newClipDate = input.value; newClipDateEditing = false; renderNewClipDateRow(); };
    input.onblur = () => { newClipDateEditing = false; renderNewClipDateRow(); };
    row.appendChild(input);
  } else if (newClipDate) {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'date-pill-btn confirmed';
    pill.innerHTML = '📅 ' + formatDateLong(newClipDate);
    pill.title = 'Tap to change';
    pill.onclick = () => { newClipDateEditing = true; renderNewClipDateRow(); };

    clearBtn.type = 'button';
    clearBtn.className = 'date-pill-clear';
    clearBtn.innerHTML = '✕';
    clearBtn.title = 'Remove date';
    clearBtn.onclick = (e) => { e.stopPropagation(); newClipDate = ''; renderNewClipDateRow(); };
    row.appendChild(pill);
    row.appendChild(clearBtn);
  } else {
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'date-pill-btn';
    addBtn.textContent = '📅 Add a date';
    addBtn.onclick = () => { newClipDateEditing = true; renderNewClipDateRow(); };
    row.appendChild(addBtn);
  }
}

function buildDatePillForClip(clip) {
  const wrap = document.createElement('div');
  wrap.className = 'date-pill-row';
  const isEditing = editingDateIds.has(clip.id);
  if (isEditing || !clip.scheduledDate) {
    if (isEditing) {
      const input = document.createElement('input');
      input.type = 'date';
      input.value = clip.scheduledDate || '';
      input.autofocus = true;
      input.onchange = () => { setScheduledDate(clip.id, input.value); editingDateIds.delete(clip.id); refreshOpenModal(); render(); };
      input.onblur = () => { if (clip.scheduledDate) { editingDateIds.delete(clip.id); render(); } };
      wrap.appendChild(input);
    } else {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'date-pill-btn';
      addBtn.textContent = '📅 Add a date';
      addBtn.onclick = () => { editingDateIds.add(clip.id); render(); refreshOpenModal(); };
      wrap.appendChild(addBtn);
    }
  } else {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'date-pill-btn confirmed';
    pill.innerHTML = '📅 ' + formatDateLong(clip.scheduledDate);
    pill.title = 'Tap to change';
    pill.onclick = () => { editingDateIds.add(clip.id); render(); refreshOpenModal(); };
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'date-pill-clear';
    clearBtn.innerHTML = '✕';
    clearBtn.title = 'Remove date';
    clearBtn.onclick = (e) => { e.stopPropagation(); setScheduledDate(clip.id, ''); refreshOpenModal(); };
    wrap.appendChild(pill);
    wrap.appendChild(clearBtn);
  }
  return wrap;
}

function toggleNewClipTone(tone) {
  const idx = newClipTones.indexOf(tone);
  if (idx > -1) newClipTones.splice(idx, 1);
  else newClipTones.push(tone);
  renderNewClipTones();
}

    chip.textContent = p;
    chip.onclick = () => setNewClipPlatform(p);
    row.appendChild(chip);
  });
}

function renderNewClipTones() {
  const row = document.getElementById('newClipToneRow');
  row.innerHTML = '';

    const chip = document.createElement('div');
    chip.className = 'tone-chip' + (newClipTones.includes(tone) ? ' selected' : '');
    chip.textContent = tone;
    chip.onclick = () => toggleNewClipTone(tone);
    row.appendChild(chip);
  });
}

function toggleTone(clipId, tone) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const idx = clip.selectedTones.indexOf(tone);
  if (idx > -1) clip.selectedTones.splice(idx, 1);
  else clip.selectedTones.push(tone);
  saveClips();
  render();
}

function setPlatform(clipId, platform) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  clip.platform = platform;
  saveClips();
  render();
}

    selected_tones: clip.selectedTones || ['Deadpan nature-doc'],
    platform: clip.platform || 'Both',
    caption_tones: clip.captionTones || [],
    captions: clip.captions || null,
    updated_at: new Date().toISOString()
  };
}

function isLikelyArtifactPreview() {
  try { return window.self !== window.top; } catch (e) { return true; }
}

const NETWORK_HINT = isLikelyArtifactPreview()
  ? ' (Claude\'s artifact preview blocks calls to Supabase — this works once deployed, e.g. on GitHub Pages)'
  : ' — check your connection';

let isLoadingClips = false;

async function loadClips() {
  if (isLoadingClips) return;
  isLoadingClips = true;
  const hadDataBefore = clips.length > 0;
  setSyncStatus('Syncing…');
  try {
    const { data, error } = await sb.from('ttt_clips').select('*').order('created', { ascending: false });
    if (error) throw error;
    clips = (data || []).map(rowToClip);
    setSyncStatus('Synced ✓');
  } catch (e) {
    console.error('Load error:', (e && (e.message || e.toString && e.toString())) || 'unknown error');
    isOfflinePreview = isLikelyArtifactPreview();
    if (!hadDataBefore) clips = [];
    setSyncStatus('Offline' + NETWORK_HINT, true);
  }
  isLoadingClips = false;
  render();
}

async function saveClips() {
  if (!clips.length) return;
  try {
    const rows = clips.map(clipToRow);
    const { error } = await sb.from('ttt_clips').upsert(rows, { onConflict: 'id' });
    if (error) throw error;
    setSyncStatus('Synced ✓');
  } catch (e) {
    console.error('Save error', e);
    setSyncStatus('Sync failed' + NETWORK_HINT, true);
  }
}

async function deleteClipRemote(id) {
  try {
    const { error } = await sb.from('ttt_clips').delete().eq('id', id);
    if (error) throw error;
  } catch (e) {
    console.error('Delete error', e);
    setSyncStatus('Delete failed' + NETWORK_HINT, true);
  }
}

function uid() { return 'c' + Date.now() + Math.floor(Math.random()*1000); }

function addClip() {
  const desc = document.getElementById('descInput').value.trim();
  if (!desc) return;
  const dateVal = newClipDate;
  clips.unshift({
    id: uid(),
    desc,
    status: dateVal ? 'scheduled' : 'idea',
    created: new Date().toISOString(),
    captions: null,
    selectedTones: newClipTones.length ? [...newClipTones] : ['Deadpan nature-doc'],
    platform: newClipPlatform,
    scheduledDate: dateVal || ''
  });
  document.getElementById('descInput').value = '';
  newClipDate = '';
  newClipDateEditing = false;
  renderNewClipDateRow();
  saveClips();
  render();
  closeEntrySheet();
}

function openEntrySheet() {
  document.getElementById('entryForm').classList.add('sheet-open');
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('descInput').focus();
}

function closeEntrySheet() {
  document.getElementById('entryForm').classList.remove('sheet-open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}

function updateStatus(id, status) {
  const c = clips.find(c => c.id === id);
  if (c) { c.status = status; saveClips(); render(); }
}

function setScheduledDate(id, dateStr) {
  const c = clips.find(c => c.id === id);
  if (!c) return;
  c.scheduledDate = dateStr;
  if (dateStr && c.status !== 'posted' && c.status !== 'scheduled') c.status = 'scheduled';
  saveClips();
  render();
}

function removeClip(id) {
  clips = clips.filter(c => c.id !== id);
  deleteClipRemote(id);
  render();
}

async function generateCaptions(id) {
  const clip = clips.find(c => c.id === id);
  if (!clip) return;
  loadingCaptions[id] = true;
  render();

  const tones = (clip.selectedTones && clip.selectedTones.length) ? clip.selectedTones : ['Deadpan nature-doc'];
  const toneGuide = {
    'Deadpan nature-doc': 'Attenborough-style narration, dry and scientific, treating mundane behavior as a serious phenomenon. No exclamation points.',
    'Funny': 'Straightforwardly comedic, punchy, built for a laugh in one read.',
    'Educational': 'Frames the moment around a real (or plausibly real) cat behavior fact, teaches the viewer something.',
    'Meme-style': 'Short, internet-native phrasing, leans on a recognizable meme format or rhythm rather than full sentences.',
    'Relatable': 'Written like a knowing aside to other pet owners, "when your cat does X" energy.',
    'Multi-cat tie-in': 'Explicitly references the dynamic or contrast between two or more of the four cats (Cali, Neo, Ramses, Diego).',
    'Wholesome': 'Warm, affectionate, sincere, no irony.'
  };
  const toneInstructions = tones.map(t => '- ' + t + ': ' + (toneGuide[t] || '')).join('\n');

  const platform = clip.platform || 'Both';
  const platformGuide = {
    'Instagram': 'Optimize for Instagram (Reels/carousel). Hashtags: 12-15 tags, a mix of broad high-volume cat/pet tags and mid-size niche tags (breed-specific, cat-humor, cat-behavior communities) to maximize discoverability for a growing account. Caption can be slightly longer (1-3 sentences).',
    'TikTok': 'Optimize for TikTok. Hashtags: 4-6 tags only, favor currently high-traffic broad tags (#fyp-style reach tags, #cats, #catsoftiktok, #catbehavior) over niche ones — TikTok discovery leans on fewer, broader tags plus the algorithm, not hashtag walls. Captions should be punchier and shorter, built to be read in under 2 seconds.',
    'Both': 'Write for cross-posting to Instagram and TikTok. Hashtags: 8-10 tags, a balanced mix of broad reach tags and a couple of niche ones that work on either platform. Keep captions short enough to work as an on-screen TikTok caption but complete enough to stand alone on Instagram.'
  };

  const systemPrompt = `You write social captions for a cat content account. The account features four cats: Cali and Neo (domestic shorthairs, downstairs territory) and Ramses (Savannah) and Diego (Bengal, upstairs territory).

Critical rule: never include the account's own name or handle anywhere in the hook, captions, or hashtags. The account is small and growing, so its own name has no search reach — do not waste a hashtag or caption line on it. Every hashtag must be a real, widely-searched tag relevant to cats, pets, the specific breeds involved, or cat humor/behavior — chosen purely to maximize discoverability for people who don't yet follow the account.

Platform: ${platform}
${platformGuide[platform]}

The user has selected the following tone(s)/vibe(s) for this specific caption batch:
${toneInstructions}

If multiple tones are selected, write one caption option per tone (in the order given) so the user can compare vibes side by side. If only one tone is selected, write 3 options in that tone.

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{
  "hook": "a short on-screen text overlay for the first 1-2 seconds, matching the dominant tone",
  "captions": ["option 1", "option 2", "option 3"],
  "hashtags": "#tag1 #tag2 #tag3 #tag4 #tag5"
}
Each caption should be 1-3 sentences. Label-free — just the caption text itself.`;

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-captions`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ systemPrompt, userMessage: `Clip description: ${clip.desc}` })
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error || data));
    }
    const textBlock = data.content.find(b => b.type === 'text');
    let raw = textBlock ? textBlock.text : '{}';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    clip.captions = parsed;
    clip.captionTones = tones.length > 1 ? tones : [];
    if (clip.status === 'filmed' || clip.status === 'idea') clip.status = 'captioned';
    saveClips();
  } catch (e) {
    console.error('Caption generation failed', e);
    if (isLikelyArtifactPreview()) {
      clip.captions = buildPlaceholderCaptions(clip, tones, platform);
      clip.captionTones = tones.length > 1 ? tones : [];
      if (clip.status === 'filmed' || clip.status === 'idea') clip.status = 'captioned';
      saveClips();
    } else {
      clip.captions = { hook: '', captions: ['Could not generate captions' + NETWORK_HINT + '.'], hashtags: '' };
    }
  }
  loadingCaptions[id] = false;
  render();
}

function buildPlaceholderCaptions(clip, tones, platform) {
  const toneCaptionMap = {
    'Deadpan nature-doc': 'Observed: the subject pauses mid-task, assesses the room, and resumes as if nothing occurred.',
    'Funny': 'The audacity. The confidence. The complete lack of remorse.',
    'Educational': 'Cats do this to reset their sense of territory — it\'s a normal behavioral marker, not mischief.',
    'Meme-style': 'no thoughts. just vibes. and chaos.',
    'Relatable': 'when you do something unhinged and immediately act like it never happened',
    'Multi-cat tie-in': 'One cat causes the chaos, the other watches from a safe distance judging silently.',
    'Wholesome': 'Just a small, ordinary moment that made the whole day better.'
  };
  const list = (tones && tones.length ? tones : ['Deadpan nature-doc']).map(t => toneCaptionMap[t] || toneCaptionMap['Deadpan nature-doc']);
  while (list.length < 3) list.push(list[0]);

  const hashtagsByPlatform = {
    'Instagram': '#catsofinstagram #catbehavior #bengalcat #savannahcat #catcontent #petsofinstagram #catlovers #catmom #indoorcat #catlife',
    'TikTok': '#catsoftiktok #fyp #cats #catbehavior',
    'Both': '#catsofinstagram #catsoftiktok #catbehavior #petcontent #catlovers #fyp #bengalcat #savannahcat'
  };

  return {
    hook: '(placeholder — preview mode)',
    captions: list.slice(0, 3),
    hashtags: hashtagsByPlatform[platform] || hashtagsByPlatform['Both']
  };
}

function copyText(text, el) {
  const showCopied = () => {
    const orig = el.textContent;
    el.textContent = 'Copied ✓';
    el.classList.add('just-copied');
    setTimeout(() => { el.textContent = orig; el.classList.remove('just-copied'); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onSuccess) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    onSuccess();
  } catch (e) {
    console.error('Copy failed', e);
  }
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return '1 day ago';
  return days + ' days ago';
}

function formatDateLong(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function buildFullCard(clip, forceExpanded) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-highlight-id', clip.id);

  const isCompact = !forceExpanded && compactCardIds.has(clip.id);

  const top = document.createElement('div');
  top.className = 'card-top';
  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = clip.desc;
  const topRight = document.createElement('div');
  topRight.className = 'card-top-right';
  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + clip.status;
  stamp.textContent = STATUS_LABELS[clip.status];
  topRight.appendChild(stamp);

  if (!forceExpanded) {
    const expandBtn = document.createElement('button');
    expandBtn.className = 'expand-toggle-btn';
    expandBtn.innerHTML = isCompact ? '▾' : '▴';
    expandBtn.title = isCompact ? 'Expand' : 'Compact';
    expandBtn.onclick = (e) => {
      e.stopPropagation();
      if (isCompact) compactCardIds.delete(clip.id); else compactCardIds.add(clip.id);
      render();
    };
    topRight.appendChild(expandBtn);
  }

  const trashBtn = document.createElement('button');
  trashBtn.className = 'trash-btn';
  trashBtn.innerHTML = '🗑';
  trashBtn.title = 'Remove';
  trashBtn.onclick = () => { removeClip(clip.id); closeCardModal(); };
  topRight.appendChild(trashBtn);
  top.appendChild(desc);
  top.appendChild(topRight);
  card.appendChild(top);

  if (isCompact) {
    card.classList.add('card-compact');
    return card;
  }

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = 'Logged ' + timeAgo(clip.created);
  card.appendChild(meta);

  const platformLabel = document.createElement('div');
  platformLabel.className = 'field-label';
  platformLabel.style.marginTop = '16px';
  platformLabel.textContent = 'Platform';
  card.appendChild(platformLabel);

  if (!clip.platform) clip.platform = 'Both';
  const platformRow = document.createElement('div');
  platformRow.className = 'platform-row';
  PLATFORMS.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'platform-chip' + (clip.platform === p ? ' selected' : '');
    chip.textContent = p;
    chip.onclick = () => { setPlatform(clip.id, p); refreshOpenModal(); };
    platformRow.appendChild(chip);
  });
  card.appendChild(platformRow);

  const toneLabel = document.createElement('div');
  toneLabel.className = 'field-label';
  toneLabel.style.marginTop = '16px';
  toneLabel.textContent = 'Tone / vibe';
  card.appendChild(toneLabel);

  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const toneRow = document.createElement('div');
  toneRow.className = 'tone-row';
  TONES.forEach(tone => {
    const chip = document.createElement('div');
    chip.className = 'tone-chip' + (clip.selectedTones.includes(tone) ? ' selected' : '');
    chip.textContent = tone;
    chip.onclick = () => { toggleTone(clip.id, tone); refreshOpenModal(); };
    toneRow.appendChild(chip);
  });
  card.appendChild(toneRow);

  const dateLabel = document.createElement('div');
  dateLabel.className = 'field-label';
  dateLabel.style.marginTop = '16px';
  dateLabel.textContent = 'Date';
  card.appendChild(dateLabel);
  card.appendChild(buildDatePillForClip(clip));

  const bottomRow = document.createElement('div');
  bottomRow.className = 'card-bottom-row';

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const select = document.createElement('select');
  STATUSES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = STATUS_LABELS[s];
    if (s === clip.status) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = () => { updateStatus(clip.id, select.value); refreshOpenModal(); };
  actions.appendChild(select);
  bottomRow.appendChild(actions);

  const genBtn = document.createElement('button');
  genBtn.className = 'gen-caption-btn';
  genBtn.innerHTML = loadingCaptions[clip.id] ? '' : (clip.captions ? 'Regenerate captions' : 'Generate captions');
  if (loadingCaptions[clip.id]) {
    genBtn.disabled = true;
    genBtn.innerHTML = 'Writing <span class="spinner"></span>';
  }
  genBtn.onclick = () => generateCaptions(clip.id);
  bottomRow.appendChild(genBtn);

  card.appendChild(bottomRow);

  if (clip.captions) {
    const isCollapsed = collapsedCaptionIds.has(clip.id);
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'captions-toggle';
    toggleBtn.innerHTML = isCollapsed ? '▸ Show captions' : '▾ Hide captions';
    toggleBtn.onclick = () => {
      if (isCollapsed) collapsedCaptionIds.delete(clip.id); else collapsedCaptionIds.add(clip.id);
      render();
    };
    card.appendChild(toggleBtn);

    const box = document.createElement('div');
    box.className = 'captions-box';
    if (isCollapsed) box.style.display = 'none';

    if (clip.captions.hook) {
      const hookP = document.createElement('div');
      hookP.className = 'hook-line';
      hookP.textContent = '"' + clip.captions.hook + '"';
      box.appendChild(hookP);
    }

    const usedTones = clip.captionTones || [];
    (clip.captions.captions || []).forEach((cap, i) => {
      const optDiv = document.createElement('div');
      optDiv.className = 'caption-opt';
      const topRow = document.createElement('div');
      topRow.className = 'caption-opt-top';
      const tag = document.createElement('span');
      tag.className = 'copy-tag';
      tag.textContent = usedTones[i] ? usedTones[i] : 'Option ' + (i+1);
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = () => copyText(cap, copyBtn);
      topRow.appendChild(tag);
      topRow.appendChild(copyBtn);
      optDiv.appendChild(topRow);
      const capText = document.createElement('div');
      capText.textContent = cap;
      optDiv.appendChild(capText);
      box.appendChild(optDiv);
    });

    if (clip.captions.hashtags) {
      const hashWrap = document.createElement('div');
      hashWrap.className = 'hashtags-wrap';
      const hashDiv = document.createElement('div');
      hashDiv.className = 'hashtags';
      hashDiv.textContent = clip.captions.hashtags;
      const hashCopyBtn = document.createElement('button');
      hashCopyBtn.className = 'copy-btn';
      hashCopyBtn.textContent = 'Copy';
      hashCopyBtn.onclick = () => copyText(clip.captions.hashtags, hashCopyBtn);
      hashWrap.appendChild(hashDiv);
      hashWrap.appendChild(hashCopyBtn);
      box.appendChild(hashWrap);
    }

    card.appendChild(box);
  }

  return card;
}

function buildGridTile(clip) {
  const tile = document.createElement('div');
  tile.className = 'grid-tile';
  tile.setAttribute('data-highlight-id', clip.id);

  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + clip.status;
  stamp.textContent = STATUS_LABELS[clip.status];
  tile.appendChild(stamp);

  const desc = document.createElement('div');
  desc.className = 'grid-tile-desc';
  if (clip.captions && clip.captions.captions && clip.captions.captions[0]) {
    desc.textContent = clip.captions.captions[0];
  } else {
    desc.textContent = clip.desc;
  }
  tile.appendChild(desc);

  const footer = document.createElement('div');
  footer.className = 'grid-tile-footer';
  if (clip.scheduledDate) {
    footer.textContent = '📅 ' + formatDateLong(clip.scheduledDate);
  } else if (clip.captions) {
    footer.textContent = '💬 tap to see all captions';
  } else {
    footer.textContent = timeAgo(clip.created);
  }
  tile.appendChild(footer);

  tile.onclick = () => openCardModal(clip.id);
  return tile;
}

function buildNoteRow(clip) {
  const row = document.createElement('div');
  row.className = 'note-row';
  row.setAttribute('data-highlight-id', clip.id);

  const dot = document.createElement('span');
  dot.className = 'note-dot ' + clip.status;
  row.appendChild(dot);

  const title = document.createElement('span');
  title.className = 'note-title';

  const chevron = document.createElement('span');
  chevron.className = 'note-chevron';
  chevron.textContent = '›';

function openCardModal(id) {
  const overlay = document.getElementById('cardModalOverlay');
  const box = document.getElementById('cardModalBox');
  box.innerHTML = '';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = closeCardModal;
  box.appendChild(closeBtn);

  const clip = clips.find(c => c.id === id);
  if (clip) box.appendChild(buildFullCard(clip, true));

  overlay.classList.add('open');
  overlay.dataset.clipId = id;
}

function closeCardModal() {
  document.getElementById('cardModalOverlay').classList.remove('open');
  document.getElementById('cardModalOverlay').removeAttribute('data-clip-id');
}

function refreshOpenModal() {
  const overlay = document.getElementById('cardModalOverlay');
  if (overlay.classList.contains('open') && overlay.dataset.clipId) {
    openCardModal(overlay.dataset.clipId);
  }
}

document.getElementById('cardModalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'cardModalOverlay') closeCardModal();
});

function isMobile() {
  return window.matchMedia('(max-width: 600px)').matches;
}

function render() {
  const mobile = isMobile();
  document.body.classList.toggle('view-calendar-full', currentView === 'calendar' && mobile);

  const toggle = document.getElementById('viewToggle');
  toggle.innerHTML = '';
  ['log','grid','calendar'].forEach(v => {
    const btn = document.createElement('button');
    btn.textContent = VIEW_META[v].icon;
    btn.title = VIEW_META[v].label;
    btn.className = currentView === v ? 'active' : '';
    btn.onclick = () => { currentView = v; render(); };
    toggle.appendChild(btn);
  });
  renderBottomTabs();

  const showList = currentView === 'log' || currentView === 'grid';
  document.getElementById('cardList').style.display = showList ? (currentView === 'grid' ? 'grid' : 'block') : 'none';
  document.getElementById('calendarView').style.display = currentView === 'calendar' ? 'block' : 'none';
  document.getElementById('filterRow').style.display = showList ? 'flex' : 'none';

  if (currentView === 'calendar') {
    renderCalendar();
    renderTally();
    refreshOpenModal();
    return;
  }

  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';
  const select = document.createElement('select');
  select.id = 'filterSelect';
  const allOpt = document.createElement('option');
  allOpt.value = 'all';
  allOpt.textContent = 'All (' + clips.length + ')';
  select.appendChild(allOpt);
  STATUSES.forEach(s => {
    const count = clips.filter(c => c.status === s).length;
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = STATUS_LABELS[s] + ' (' + count + ')';
    select.appendChild(opt);
  });
  select.value = activeFilter;
  select.onchange = () => { activeFilter = select.value; render(); };
  filterRow.appendChild(select);

  const list = document.getElementById('cardList');
  list.innerHTML = '';
  const filtered = activeFilter === 'all' ? clips : clips.filter(c => c.status === activeFilter);

  if (currentView === 'grid') list.className = 'cardlist-grid';
  else if (currentView === 'log' && mobile) list.className = 'note-list';
  else list.className = '';

  if (filtered.length === 0) {
    list.innerHTML = isOfflinePreview
      ? '<div class="empty-state">Preview mode: can\'t reach the cloud database here, so nothing\'s loaded. Add a caption to test the UI — it\'ll stay local to this preview. Your real data is safe and will show up on the deployed site.</div>'
      : '<div class="empty-state">No captions logged yet. The field is quiet.</div>';
  } else {
    filtered.forEach(clip => {
      let node;
      if (currentView === 'grid') node = buildGridTile(clip);
      else if (currentView === 'log' && mobile) node = buildNoteRow(clip);
      else node = buildFullCard(clip);
      list.appendChild(node);
    });
  }

  document.getElementById('catalogNum').textContent = 'No. ' + String(clips.length).padStart(3, '0');
  renderTally();
  refreshOpenModal();
}

function renderBottomTabs() {
  const bar = document.getElementById('bottomTabBar');
  if (!bar) return;
  bar.innerHTML = '';
  ['log','grid','calendar'].forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'bottom-tab' + (currentView === v ? ' active' : '');
    const labels = { log: 'Log', grid: 'Grid', calendar: 'Calendar' };
    btn.innerHTML = '<span class="bottom-tab-icon">' + VIEW_META[v].icon + '</span><span class="bottom-tab-label">' + labels[v] + '</span>';
    btn.onclick = () => { currentView = v; render(); };
    bar.appendChild(btn);
  });
}

function renderTally() {
  document.getElementById('catalogNum').textContent = 'No. ' + String(clips.length).padStart(3, '0');
  const posted = clips.filter(c => c.status === 'posted').length;
  const pending = clips.length - posted;
  document.getElementById('tally').innerHTML =
    '<span>' + pending + ' pending in the field</span><span>' + posted + ' catalogued (posted)</span>';
}

function renderCalendar() {
  const container = document.getElementById('calendarView');
  const now = new Date();
  const viewDate = new Date(now.getFullYear(), now.getMonth() + calMonthOffset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthLabel = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('-');

  const clipsByDate = {};
  clips.forEach(c => {
    if (c.scheduledDate) {
      if (!clipsByDate[c.scheduledDate]) clipsByDate[c.scheduledDate] = [];
      clipsByDate[c.scheduledDate].push(c);
    }
  });

  let html = '<div class="cal-header">';
  html += '<h2>' + monthLabel + '</h2>';
  html += '<div class="nav-btns"><button id="calPrev">‹ Prev</button><button id="calToday">Today</button><button id="calNext">Next ›</button></div>';
  html += '</div>';
  html += '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += '<div class="cal-dow">' + d + '</div>'; });

  for (let i = 0; i < firstDow; i++) html += '<div class="cal-cell empty"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const isToday = dateStr === todayStr;
    html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
    html += '<div class="cal-daynum">' + day + '</div>';
    (clipsByDate[dateStr] || []).forEach(c => {
      html += '<div class="cal-post ' + c.status + '" data-clip-id="' + c.id + '" title="' + c.desc.replace(/"/g,'&quot;') + '">' + escapeHtml(c.desc) + '</div>';
    });
    html += '</div>';
  }

  const totalCells = firstDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += '<div class="cal-cell empty"></div>';
  html += '</div>';

  const numWeeks = Math.ceil((firstDow + daysInMonth) / 7);
  container.innerHTML = html;
  container.style.setProperty('--cal-weeks', numWeeks);

  document.getElementById('calPrev').onclick = () => { calMonthOffset--; renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonthOffset++; renderCalendar(); };
  document.getElementById('calToday').onclick = () => { calMonthOffset = 0; renderCalendar(); };

  container.querySelectorAll('.cal-post').forEach(el => {
    el.onclick = () => openCardModal(el.dataset.clipId);
  });
}

document.getElementById('addBtn').addEventListener('click', addClip);
document.getElementById('fabAddBtn').addEventListener('click', openEntrySheet);
document.getElementById('sheetCloseBtn').addEventListener('click', closeEntrySheet);
document.getElementById('sheetBackdrop').addEventListener('click', closeEntrySheet);
document.getElementById('descInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.metaKey) addClip();
});

function loadTheme() {
  let saved = 'berry';
  try { saved = localStorage.getItem('ttt-theme') || 'berry'; } catch (e) {}
  applyTheme(THEMES[saved] ? saved : 'berry', true);
}

if (window.matchMedia('(max-width: 600px)').matches) {
  currentView = 'log';
}

renderNewClipTones();
renderNewClipPlatform();
renderNewClipDateRow();
loadTheme();
loadClips();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadClips();
});
window.addEventListener('focus', () => { loadClips(); });
window.addEventListener('resize', () => { render(); });

</script>
</body>
</html>
