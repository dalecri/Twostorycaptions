<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TwoStoryCaptions">
<meta name="theme-color" content="#274F8B">
<title>TwoStoryCaptions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE8D8;
    --paper-light: #F8F4EA;
    --ink: #2B3532;
    --ink-soft: #565f56;
    --moss: #6B7A5E;
    --moss-dark: #4d5943;
    --rust: #A6544A;
    --line: #cdc2a4;
    --stamp-idea: #8a8478;
    --stamp-filmed: #7c8a6a;
    --stamp-captioned: #b08a4a;
    --stamp-scheduled: #4a7a8a;
    --stamp-posted: #4d5943;
    --spark: #C98A2E;
    --spark-dark: #A66F1F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  header.masthead .title-block h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 24px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header.masthead .title-block p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin: 6px 0 0;
  }
  header.masthead .catalog-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .entry-form {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 30px;
    position: relative;
  }
  .entry-form::before {
    content: "NEW CAPTION";
    position: absolute;
    top: -10px;
    left: 20px;
    background: var(--paper);
    padding: 0 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--moss-dark);
  }
  .entry-form textarea, .entry-form select {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 10px;
    resize: vertical;
  }
  input.app-input, select.app-input, .entry-form input[type="url"] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
  }
  .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .link-open-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 8px 12px;
    border: 1px solid var(--moss);
    background: transparent;
    color: var(--moss-dark);
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
  }
  .link-open-btn:hover { background: var(--moss); color: #fff; }
  .note-link-icon { font-size: 12px; color: var(--ink-soft); flex-shrink: 0; }
  .grid-tile-link { font-size: 11px; }
  .field-group { margin: 16px 0; }
  .field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-light);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  button:hover { background: var(--moss-dark); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  button.ghost:hover { background: var(--ink); color: var(--paper-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ===== Date pill (shared design: new-caption form + card) ===== */
  .date-pill-row { display: flex; align-items: center; gap: 8px; }
  .date-pill-row input[type="date"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
  }
  .date-pill-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .date-pill-btn:hover { border-color: var(--stamp-scheduled); color: var(--stamp-scheduled); transform: none; }
  .date-pill-btn.confirmed {
    border: 1px solid var(--stamp-scheduled);
    color: var(--stamp-scheduled);
    background: color-mix(in srgb, var(--stamp-scheduled) 8%, transparent);
  }
  .date-pill-clear {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 6px 8px;
    opacity: 0.6;
  }
  .date-pill-clear:hover { opacity: 1; background: transparent; transform: none; }

  /* ===== Minimal dropdown filter ===== */
  .filters-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .filter-row { margin-bottom: 0; }
  .filters-bar-select { width: auto; min-width: 130px; }
  .filters-bar-search { width: auto; flex: 1; min-width: 160px; }
  #filterSelect {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper-light);
    color: var(--ink);
  }

  /* ===== Cards: simplified ===== */
  .card {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .card-top-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .trash-btn {
    background: transparent;
    border: none;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0.55;
  }
  .trash-btn:hover { opacity: 1; }
  .expand-toggle-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 11px;
    line-height: 1;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .expand-toggle-btn:hover { border-color: var(--moss); color: var(--moss); }
  .card.card-compact { padding-bottom: 16px; }
  .card.card-compact .card-top { margin-bottom: 0; }
  .card.card-compact .card-desc { font-size: 15px; }
  .captions-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--moss-dark);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 0 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .captions-toggle:hover { text-decoration: underline; }
  .card-desc {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
  }
  .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border: none;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    background: color-mix(in srgb, currentColor 16%, var(--paper-light));
  }
  .stamp.idea { color: var(--stamp-idea); }
  .stamp.filmed { color: var(--stamp-filmed); }
  .stamp.captioned { color: var(--stamp-captioned); }
  .stamp.scheduled { color: var(--stamp-scheduled); }
  .stamp.posted { color: var(--stamp-posted); }

  .card-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .card-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .card-actions select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .card-actions button { padding: 6px 10px; font-size: 10.5px; }
  .gen-caption-btn {
    background: var(--spark);
    color: #fff;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 11.5px;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .gen-caption-btn:hover { background: var(--spark-dark); }
  .gen-caption-btn:disabled { background: var(--spark); opacity: 0.75; }
  .remove-btn {
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
  }
  .remove-btn:hover { background: var(--rust); color: #fff; }

  .captions-box {
    margin-top: 14px;
    border-top: 1px dashed var(--line);
    padding-top: 16px;
  }
  .caption-opt {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .caption-opt-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .caption-opt .copy-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--moss-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .copy-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--moss);
    background: transparent;
    color: var(--moss-dark);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.12s ease;
  }
  .copy-btn:hover { background: var(--moss); color: #fff; }
  .copy-btn.just-copied { background: var(--moss); color: #fff; border-color: var(--moss); }
  .hook-line { font-style: normal; font-weight: 600; color: var(--moss-dark); }
  .hashtags-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  .hashtags { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); flex: 1; }

  .tone-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tone-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tone-chip:hover { border-color: var(--moss); }
  .tone-chip.selected { background: var(--moss); border-color: var(--moss); color: #fff; }

  .platform-row {
    display: inline-flex;
    gap: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .platform-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .platform-chip:hover { background: color-mix(in srgb, var(--rust) 10%, transparent); }
  .platform-chip.selected { background: var(--rust); color: #fff; }

  /* ===== View toggle (icon-only) ===== */
  .view-toggle {
    display: inline-flex;
    width: fit-content;
    max-width: 100%;
    gap: 0;
    margin-bottom: 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .view-toggle button {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    padding: 8px 14px;
    font-size: 15px;
  }
  .view-toggle button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); transform: none; }
  .view-toggle button.active { background: var(--moss); color: #fff; }
  .view-toggle button.active:hover { background: var(--moss); }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-header h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
  }
  .cal-header .nav-btns { display: flex; gap: 8px; }
  .cal-header .nav-btns button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 5px 12px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: auto repeat(var(--cal-weeks, 5), 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .cal-dow {
    background: var(--ink);
    color: var(--paper-light);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    padding: 6px 2px;
  }
  .cal-cell {
    background: var(--paper-light);
    min-height: 70px;
    padding: 6px;
    position: relative;
    overflow: hidden;
  }
  .cal-cell.empty { background: var(--paper); }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--moss); }
  .cal-daynum {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .cal-post {
    font-size: 10.5px;
    line-height: 1.3;
    background: #fff;
    border-left: 3px solid var(--moss);
    padding: 3px 5px;
    margin-bottom: 3px;
    cursor: pointer;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cal-post.posted { border-left-color: var(--stamp-posted); opacity: 0.7; }
  .cal-post.scheduled { border-left-color: var(--stamp-scheduled); }
  .cal-post.captioned { border-left-color: var(--stamp-captioned); }

  .theme-picker { position: relative; }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-light);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 7px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .theme-btn:hover { background: var(--ink); color: var(--paper-light); }
  .theme-swatch-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15) inset;
  }
  .theme-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--paper-light);
    border: 1px solid var(--ink);
    width: 250px;
    z-index: 200;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.08);
  }
  .theme-dropdown.open { display: block; }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .theme-option:last-child { border-bottom: none; }
  .theme-option:hover { background: var(--paper); }
  .theme-option.selected { background: var(--paper); font-weight: 600; }
  .theme-swatch-pair {
    display: flex;
    width: 32px;
    height: 20px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }
  .theme-swatch-pair div { flex: 1; }
  .theme-option-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink);
  }

  .cardlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
    align-items: stretch;
  }
  .grid-tile {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 12px;
    aspect-ratio: 1 / 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .grid-tile:hover { transform: translateY(-2px); }
  .grid-tile-desc {
    font-size: 13px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 8px 0;
  }
  .grid-tile-footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }

  /* ===== Mobile "notes app" list ===== */
  .note-list { border-top: 1px solid var(--line); }
  .note-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .note-row:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .note-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .note-dot.idea { background: var(--stamp-idea); }
  .note-dot.filmed { background: var(--stamp-filmed); }
  .note-dot.captioned { background: var(--stamp-captioned); }
  .note-dot.scheduled { background: var(--stamp-scheduled); }
  .note-dot.posted { background: var(--stamp-posted); }
  .note-title {
    flex: 1;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-chevron { color: var(--ink-soft); font-size: 16px; flex-shrink: 0; }

  /* ===== Outreach / brand partnership board ===== */
  .ot-stats {
    display: flex;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .ot-stat {
    flex: 1;
    min-width: 110px;
    padding: 14px 16px;
    border-right: 1px solid var(--line);
    background: var(--paper-light);
  }
  .ot-stat:last-child { border-right: none; }
  .ot-num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; }
  .ot-lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .ot-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .ot-quickadd { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .ot-quickadd.open { display: flex; }
  .ot-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    background: var(--paper-light);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .ot-chip:hover { border-color: var(--moss); color: var(--moss-dark); transform: none; }

  .ot-panel {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 22px;
    display: none;
    position: relative;
  }
  .ot-panel.open { display: block; }
  .ot-panel::before {
    content: "BRAND";
    position: absolute;
    top: -10px;
    left: 20px;

<body>
<div class="wrap">

  <header class="masthead">
    <div class="title-block">
      <h1>TwoStoryCaptions</h1>
      <p id="syncStatus">Connecting…</p>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="catalog-num" id="catalogNum">No. ——</div>
      <div class="theme-picker">
        <button class="theme-btn" id="themeBtn"><span class="theme-swatch-dot" id="themeBtnDot"></span> Theme</button>
        <div class="theme-dropdown" id="themeDropdown"></div>
      </div>
    </div>
  </header>

  <div class="entry-form" id="entryForm">
    <div class="sheet-header">
      <span>New caption</span>
      <button class="sheet-close" id="sheetCloseBtn">✕</button>
    </div>
    <textarea id="descInput" rows="2" placeholder="e.g. Diego knocked a mug off the counter, then stared directly at the camera for four seconds"></textarea>

    <div class="field-group">
      <div class="field-label">Tone</div>
      <div class="tone-row" id="newClipToneRow"></div>
    </div>

    <div class="field-group">
      <div class="field-label">Platform</div>
      <div class="platform-row" id="newClipPlatformRow"></div>
    </div>

    <div class="field-group">
      <div class="field-label">Brand (optional)</div>
      <select id="newClipBrandSelect" class="app-input"><option value="">— none —</option></select>
    </div>

    <div class="field-group">
      <div class="field-label">Date</div>
      <div class="date-pill-row" id="newClipDateRow"></div>
    </div>

    <div class="field-group">
      <div class="field-label">Video link</div>
      <input type="url" id="newClipLinkInput" class="app-input" placeholder="🔗 Google Photos link (optional)">
    </div>

    <div style="display:flex; justify-content:flex-end;">
      <button id="addBtn">Log Entry</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <div class="filters-bar" id="filtersBar">
    <div class="filter-row" id="filterRow"></div>
    <select id="brandFilterSelect" class="app-input filters-bar-select"><option value="">All brands</option></select>
    <input id="searchInput" class="app-input filters-bar-search" placeholder="🔍 Search captions...">
  </div>

  <div class="view-toggle" id="viewToggle"></div>

  <div id="cardList"></div>
  <div id="calendarView" style="display:none;"></div>

  <div id="outreachView" style="display:none;">
    <div class="ot-subnav" id="otSubnav">
      <button type="button" class="ot-subtab active" id="otTabPipeline">Pipeline</button>
      <button type="button" class="ot-subtab" id="otTabTemplates">Templates</button>
    </div>

    <div id="otPipelineSection">
      <div class="ot-stats" id="otStats"></div>
      <div class="ot-toolbar">
        <button id="otOpenForm">+ Add brand</button>
        <button class="ghost" id="otToggleQuick">Quick-add suggestions</button>
      </div>
      <div class="ot-quickadd" id="otQuickadd"></div>

      <div class="ot-panel" id="otPanel">
        <h3 id="otPanelTitle">Add a brand</h3>
        <div class="ot-grid2">
          <div>
            <label>Brand name</label>
            <input id="ot-f-name" placeholder="e.g. kin+Kind">
          </div>
          <div>
            <label>Category</label>
            <input id="ot-f-category" placeholder="e.g. Supplements, Litter, Toys">
          </div>
        </div>
        <div class="ot-grid2">
          <div>
            <label>Status</label>
            <select id="ot-f-status">
              <option value="researching">Researching</option>
              <option value="applied">Applied</option>
              <option value="waiting">Waiting to hear back</option>
              <option value="partnered">Partnered</option>
              <option value="passed">Passed / declined</option>
            </select>
          </div>
          <div>
            <label>Contact method</label>
            <input id="ot-f-contact" placeholder="e.g. Ambassador form, email, DM">
          </div>
        </div>
        <div class="ot-grid2">
          <div>
            <label>Product you use</label>
            <input id="ot-f-product" placeholder="e.g. Organic Pumpkin Powder">
          </div>
          <div>
            <label>Date contacted</label>
            <input id="ot-f-date" type="date">
          </div>
        </div>
        <label>Notes / code / link</label>
        <textarea id="ot-f-notes" placeholder="Application link, discount code, who you talked to, follow-up date..."></textarea>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <button id="otSaveBtn">Save</button>
          <button class="ghost" id="otCancelBtn">Cancel</button>
        </div>
      </div>

      <div class="ot-board" id="otBoard"></div>
    </div>

    <div id="otTemplatesSection" style="display:none;">
      <div class="ot-panel open">
        <h3>Fill in the details</h3>
        <div class="ot-grid2">
          <div>
            <label>Load from brand (optional)</label>
            <select id="tplBrandSelect"><option value="">— none / custom —</option></select>
          </div>
          <div>
            <label>Brand name</label>
            <input id="tplBrandName" placeholder="e.g. kin+Kind">
          </div>
        </div>
        <div class="ot-grid2">
          <div>
            <label>Product</label>
            <input id="tplProduct" placeholder="e.g. Organic Pumpkin Powder">
          </div>
          <div>
            <label>Category</label>
            <input id="tplCategory" placeholder="e.g. Litter, Dental, Supplements">
          </div>
        </div>
        <div class="ot-grid2">
          <div>
            <label>Time used</label>
            <input id="tplDuration" placeholder="e.g. 3 months">
          </div>
          <div>
            <label>Your name (sign-off)</label>
            <input id="tplName" value="Cris">
          </div>
        </div>
        <div class="ot-grid2">

function fillTemplate(text, vars) {
  return text
    .replace(/\[BRAND\]/gi, vars.brand || '[BRAND]')
    .replace(/\[PRODUCT\]/gi, vars.product || '[PRODUCT]')
    .replace(/\[CATEGORY\]/gi, vars.category || '[CATEGORY]')
    .replace(/\[X\s*(MONTHS|WEEKS)\]/gi, vars.duration || '[X $1]')
    .replace(/\[NAME\]/gi, vars.name || '[NAME]')
    .replace(/\[CAT\]/gi, vars.cat || '[CAT]');
}

// Format C alternates upstairs/downstairs cat per [CAT] occurrence (order in the source text is upstairs, then downstairs)
function fillTwoFloorTemplate(text, vars) {
  let occurrence = 0;
  let filled = text.replace(/\[CAT\]/gi, () => {
    occurrence++;
    return occurrence === 1 ? (vars.upstairsCat || '[CAT]') : (vars.downstairsCat || '[CAT]');
  });
  return fillTemplate(filled, vars);
}

function applyTheme(name, skipSave) {
  currentTheme = name;
  const theme = THEMES[name];
  const root = document.documentElement.style;
  Object.entries(theme.vars).forEach(([k, v]) => root.setProperty(k, v));
  document.getElementById('themeBtnDot').style.background = theme.swatches[1];
  renderThemeDropdown();
  if (!skipSave) {
    try { localStorage.setItem('ttt-theme', name); } catch (e) {}
  }
}

function renderThemeDropdown() {
  const dd = document.getElementById('themeDropdown');
  dd.innerHTML = '';
  Object.entries(THEMES).forEach(([key, theme]) => {
    const opt = document.createElement('div');
    opt.className = 'theme-option' + (currentTheme === key ? ' selected' : '');
    const pair = document.createElement('div');
    pair.className = 'theme-swatch-pair';
    theme.swatches.forEach(c => {
      const half = document.createElement('div');
      half.style.background = c;
      pair.appendChild(half);
    });
    const label = document.createElement('div');
    label.className = 'theme-option-label';
    label.textContent = theme.label;
    opt.appendChild(pair);
    opt.appendChild(label);
    opt.onclick = () => { applyTheme(key); document.getElementById('themeDropdown').classList.remove('open'); };
    dd.appendChild(opt);
  });
}

function buildDatePillForClip(clip) {
  const wrap = document.createElement('div');
  wrap.className = 'date-pill-row';
  const isEditing = editingDateIds.has(clip.id);
  if (isEditing || !clip.scheduledDate) {
    if (isEditing) {
      const input = document.createElement('input');
      input.type = 'date';
      input.value = clip.scheduledDate || '';
      input.autofocus = true;
      input.onchange = () => { setScheduledDate(clip.id, input.value); editingDateIds.delete(clip.id); refreshOpenModal(); render(); };
      input.onblur = () => { if (clip.scheduledDate) { editingDateIds.delete(clip.id); render(); } };
      wrap.appendChild(input);
    } else {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'date-pill-btn';
      addBtn.textContent = '📅 Add a date';
      addBtn.onclick = () => { editingDateIds.add(clip.id); render(); refreshOpenModal(); };
      wrap.appendChild(addBtn);
    }
  } else {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'date-pill-btn confirmed';
    pill.innerHTML = '📅 ' + formatDateLong(clip.scheduledDate);
    pill.title = 'Tap to change';
    pill.onclick = () => { editingDateIds.add(clip.id); render(); refreshOpenModal(); };
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'date-pill-clear';
    clearBtn.innerHTML = '✕';
    clearBtn.title = 'Remove date';
    clearBtn.onclick = (e) => { e.stopPropagation(); setScheduledDate(clip.id, ''); refreshOpenModal(); };
    wrap.appendChild(pill);
    wrap.appendChild(clearBtn);
  }
  return wrap;
}

  if (!clip) return;
  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const idx = clip.selectedTones.indexOf(tone);
  if (idx > -1) clip.selectedTones.splice(idx, 1);
  else clip.selectedTones.push(tone);
  saveClips(clipId);
  render();
}

function setPlatform(clipId, platform) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  clip.platform = platform;
  saveClips(clipId);
  render();
}

function safeParseJSON(val, fallback) {
  if (val === null || val === undefined || val === '') return fallback;
  if (typeof val === 'object') return val; // already decoded (jsonb column)
  try { return JSON.parse(val); } catch (e) { return fallback; }
}

function rowToClip(row) {
  return {
    id: row.id,
    desc: row.desc_text,
    status: row.status,
    created: row.created,
    scheduledDate: row.scheduled_date || '',
    selectedTones: safeParseJSON(row.selected_tones, ['Deadpan nature-doc']),
    platform: row.platform || 'Both',
    captionTones: safeParseJSON(row.caption_tones, []),
    captions: safeParseJSON(row.captions, null),
    videoLink: row.video_link || '',
    brandId: row.brand_id || ''
  };
}

function clipToRow(clip) {
  return {
    id: clip.id,
    desc_text: clip.desc,
    status: clip.status,
    created: clip.created,
    scheduled_date: clip.scheduledDate || null,
    // Stringified explicitly: works whether the DB column is jsonb or plain text,
    // which avoids a silent type-mismatch failure on the one field (captions)
    // that's actually an object instead of a plain string/number.
    selected_tones: JSON.stringify(clip.selectedTones || ['Deadpan nature-doc']),
    platform: clip.platform || 'Both',
    caption_tones: JSON.stringify(clip.captionTones || []),
    captions: clip.captions ? JSON.stringify(clip.captions) : null,
    video_link: clip.videoLink || null,
    brand_id: clip.brandId || null,
    updated_at: new Date().toISOString()
  };
}

function isLikelyArtifactPreview() {
  try { return window.self !== window.top; } catch (e) { return true; }
}

const NETWORK_HINT = isLikelyArtifactPreview()
  ? ' (Claude\'s artifact preview blocks calls to Supabase — this works once deployed, e.g. on GitHub Pages)'
  : ' — check your connection';

let isLoadingClips = false;
let pendingClipSaves = 0;

async function loadClips() {
  if (isLoadingClips) return;
  if (pendingClipSaves > 0) return; // don't clobber local changes that are still being saved
  isLoadingClips = true;
  const hadDataBefore = clips.length > 0;
  setSyncStatus('Syncing…');
  try {
    const { data, error } = await sb.from('ttt_clips').select('*').order('created', { ascending: false });
    if (error) throw error;
    clips = (data || []).map(rowToClip);
    setSyncStatus('Synced ✓');
  } catch (e) {
    console.error('Load error:', (e && (e.message || e.toString && e.toString())) || 'unknown error');
    isOfflinePreview = isLikelyArtifactPreview();
    if (!hadDataBefore) clips = [];
    setSyncStatus('Offline' + NETWORK_HINT, true);
  }
  isLoadingClips = false;
  render();
}

async function saveClips(clipId) {
  if (!clips.length) return true;
  pendingClipSaves++;
  try {
    const targets = clipId ? clips.filter(c => c.id === clipId) : clips;
    if (!targets.length) return true;
    const rows = targets.map(clipToRow);
    const { error } = await sb.from('ttt_clips').upsert(rows, { onConflict: 'id' });
    if (error) throw error;
    setSyncStatus('Synced ✓');
    targets.forEach(c => { c.unsynced = false; c.saveError = ''; });
    return true;
  } catch (e) {
    const msg = (e && e.message) || (e && e.toString && e.toString()) || 'unknown error';
    console.error('Save error', e);
    setSyncStatus('Sync failed' + NETWORK_HINT, true);
    const targets = clipId ? clips.filter(c => c.id === clipId) : clips;
    targets.forEach(c => { c.unsynced = true; c.saveError = msg; });
    return false;
  } finally {
    pendingClipSaves--;
  }
}

async function deleteClipRemote(id) {
  try {
    const { error } = await sb.from('ttt_clips').delete().eq('id', id);
    if (error) throw error;
  } catch (e) {
    console.error('Delete error', e);
    setSyncStatus('Delete failed' + NETWORK_HINT, true);
  }
}

async function generateCaptions(id) {
  const clip = clips.find(c => c.id === id);
  if (!clip) return;
  loadingCaptions[id] = true;
  render();

  const tones = (clip.selectedTones && clip.selectedTones.length) ? clip.selectedTones : ['Deadpan nature-doc'];
  const toneGuide = {
    'Deadpan nature-doc': 'Attenborough-style narration, dry and scientific, treating mundane behavior as a serious phenomenon. No exclamation points.',
    'Funny': 'Straightforwardly comedic, punchy, built for a laugh in one read.',
    'Educational': 'Frames the moment around a real (or plausibly real) cat behavior fact, teaches the viewer something.',
    'Meme-style': 'Short, internet-native phrasing, leans on a recognizable meme format or rhythm rather than full sentences.',
    'Relatable': 'Written like a knowing aside to other pet owners, "when your cat does X" energy.',
    'Multi-cat tie-in': 'Explicitly references the dynamic or contrast between two or more of the four cats (Cali, Neo, Ramses, Diego).',
    'Wholesome': 'Warm, affectionate, sincere, no irony.'
  };
  const toneInstructions = tones.map(t => '- ' + t + ': ' + (toneGuide[t] || '')).join('\n');

  const platform = clip.platform || 'Both';
  const platformGuide = {
    'Instagram': 'Optimize for Instagram (Reels/carousel). Caption can be slightly longer (1-3 sentences).',
    'TikTok': 'Optimize for TikTok. Captions should be punchier and shorter, built to be read in under 2 seconds.',
    'Both': 'Write for cross-posting to Instagram and TikTok. Keep captions short enough to work as an on-screen TikTok caption but complete enough to stand alone on Instagram.'
  };

  const systemPrompt = `You write social captions for a cat content account. The account features four cats: Cali and Neo (domestic shorthairs, downstairs territory) and Ramses (Savannah) and Diego (Bengal, upstairs territory).

Critical rule: never include the account's own name or handle anywhere in the hook, captions, or hashtags. The account is small and growing, so its own name has no search reach — do not waste a hashtag on it. Hashtags: exactly 3, the highest-value, broadest-reach tags for cats, pets, or the specific breeds involved — chosen purely to maximize discoverability for people who don't yet follow the account.

Platform: ${platform}
${platformGuide[platform]}

The user has selected the following tone(s)/vibe(s) for this specific caption batch:
${toneInstructions}

If multiple tones are selected, write one caption option per tone (in the order given) so the user can compare vibes side by side. If only one tone is selected, write 3 options in that tone.

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{
  "hook": "a short on-screen text overlay for the first 1-2 seconds, matching the dominant tone",
  "captions": ["option 1", "option 2", "option 3"],
  "hashtags": "#tag1 #tag2 #tag3"
}
Each caption should be 1-3 sentences. Label-free — just the caption text itself. Hashtags must be exactly 3, space-separated.`;

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-captions`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ systemPrompt, userMessage: `Clip description: ${clip.desc}` })
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error || data));
    }
    const textBlock = data.content.find(b => b.type === 'text');
    let raw = textBlock ? textBlock.text : '{}';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    clip.captions = parsed;
    clip.captionTones = tones.length > 1 ? tones : [];
    if (clip.status === 'filmed' || clip.status === 'idea') clip.status = 'captioned';
    await saveClips(clip.id);
  } catch (e) {
    console.error('Caption generation failed', e);
    if (isLikelyArtifactPreview()) {
      clip.captions = buildPlaceholderCaptions(clip, tones, platform);
      clip.captionTones = tones.length > 1 ? tones : [];
      if (clip.status === 'filmed' || clip.status === 'idea') clip.status = 'captioned';
      await saveClips(clip.id);
    } else {
      clip.captions = { hook: '', captions: ['Could not generate captions' + NETWORK_HINT + '.'], hashtags: '' };
    }
  }
  loadingCaptions[id] = false;
  render();
}

function buildPlaceholderCaptions(clip, tones, platform) {
  const toneCaptionMap = {
    'Deadpan nature-doc': 'Observed: the subject pauses mid-task, assesses the room, and resumes as if nothing occurred.',
    'Funny': 'The audacity. The confidence. The complete lack of remorse.',
    'Educational': 'Cats do this to reset their sense of territory — it\'s a normal behavioral marker, not mischief.',
    'Meme-style': 'no thoughts. just vibes. and chaos.',
    'Relatable': 'when you do something unhinged and immediately act like it never happened',
    'Multi-cat tie-in': 'One cat causes the chaos, the other watches from a safe distance judging silently.',
    'Wholesome': 'Just a small, ordinary moment that made the whole day better.'
  };
  const list = (tones && tones.length ? tones : ['Deadpan nature-doc']).map(t => toneCaptionMap[t] || toneCaptionMap['Deadpan nature-doc']);
  while (list.length < 3) list.push(list[0]);

  const hashtagsByPlatform = {
    'Instagram': '#catsofinstagram #catbehavior #bengalcat',
    'TikTok': '#catsoftiktok #fyp #cats',
    'Both': '#catsofinstagram #catsoftiktok #catbehavior'
  };

  return {
    hook: '(placeholder — preview mode)',
    captions: list.slice(0, 3),
    hashtags: hashtagsByPlatform[platform] || hashtagsByPlatform['Both']
  };
}

function copyText(text, el) {
  const showCopied = () => {
    const orig = el.textContent;
    el.textContent = 'Copied ✓';
    el.classList.add('just-copied');
    setTimeout(() => { el.textContent = orig; el.classList.remove('just-copied'); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onSuccess) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    onSuccess();
  } catch (e) {
    console.error('Copy failed', e);
  }
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return '1 day ago';
  return days + ' days ago';
}

function formatDateLong(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function renderBrandBoard() {
  const board = document.getElementById('otBoard');
  if (!board) return;
  board.innerHTML = BRAND_STATUSES.map(col => {
    const items = brands.filter(b => b.status === col.key);
    return `
      <div class="ot-col ${col.key}">
        <div class="ot-col-head">
          <div class="ot-col-title">${col.label}</div>
          <div class="ot-col-count">${items.length}</div>
        </div>
        ${items.length ? items.map(brandCardHtml).join('') : '<div class="ot-empty">Nothing here yet</div>'}
      </div>
    `;
  }).join('');

  board.querySelectorAll('[data-brand-edit]').forEach(b => b.addEventListener('click', () => openBrandEdit(b.dataset.brandEdit)));
  board.querySelectorAll('[data-brand-del]').forEach(b => b.addEventListener('click', () => deleteBrand(b.dataset.brandDel)));
  board.querySelectorAll('[data-brand-followup]').forEach(b => b.addEventListener('click', () => goToFollowUpPitch(b.dataset.brandFollowup)));
  board.querySelectorAll('[data-brand-move]').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const b = brands.find(x => x.id === sel.dataset.brandMove);
      if (b) { b.status = e.target.value; saveBrands(); renderOutreach(); }
    });
  });
}

function daysSince(isoDate) {
  if (!isoDate) return null;
  const diff = Date.now() - new Date(isoDate).getTime();
  return Math.floor(diff / 86400000);
}

function brandCardHtml(b) {
  const statusOptions = BRAND_STATUSES.map(c => `<option value="${c.key}" ${c.key === b.status ? 'selected' : ''}>${c.label}</option>`).join('');
  const linkedCount = clips.filter(c => c.brandId === b.id).length;
  const idle = b.status === 'waiting' ? daysSince(b.updatedAt) : null;
  const isStale = idle !== null && idle >= 14;
  return `
    <div class="ot-card">
      <div class="ot-card-name">${escapeHtml(b.name)}</div>
      ${b.category ? `<div class="ot-card-cat">${escapeHtml(b.category)}</div>` : ''}
      ${b.product ? `<div class="ot-card-notes">Uses: ${escapeHtml(b.product)}</div>` : ''}
      ${b.notes ? `<div class="ot-card-notes">${escapeHtml(b.notes)}</div>` : ''}
      ${b.date ? `<div class="ot-card-date">${escapeHtml(b.date)}</div>` : ''}
      ${linkedCount ? `<div class="ot-card-date">🔗 ${linkedCount} caption${linkedCount === 1 ? '' : 's'} linked</div>` : ''}
      ${isStale ? `<div class="ot-stale-badge">⏰ ${idle} days since last contact — <button type="button" class="ot-mini-btn" data-brand-followup="${b.id}">Draft follow-up</button></div>` : ''}
      <div class="ot-card-actions">
        <select class="ot-mini-select" data-brand-move="${b.id}">${statusOptions}</select>
        <button type="button" class="ot-mini-btn" data-brand-edit="${b.id}">Edit</button>
        <button type="button" class="ot-mini-btn" data-brand-del="${b.id}">Delete</button>
      </div>
    </div>
  `;
}

function makeCopyableBlock(text, tagLabel) {
  const wrap = document.createElement('div');
  wrap.className = 'caption-opt';
  const topRow = document.createElement('div');
  topRow.className = 'caption-opt-top';
  const tag = document.createElement('span');
  tag.className = 'copy-tag';
  tag.textContent = tagLabel;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = 'Copy';
  copyBtn.onclick = () => copyText(text, copyBtn);
  topRow.appendChild(tag);
  topRow.appendChild(copyBtn);
  wrap.appendChild(topRow);
  const body = document.createElement('div');
  body.style.whiteSpace = 'pre-wrap';
  body.textContent = text;
  wrap.appendChild(body);
  return wrap;
}

function generatePitchOutput() {
  const ctx = getTplContext();
  const type = document.getElementById('tplPitchType').value;
  const tpl = PITCH_TEMPLATES[type];
  const out = document.getElementById('tplPitchOutput');
  out.innerHTML = '';
  if (tpl.subject) {
    const subjectFilled = fillTemplate(tpl.subject, ctx);
    out.appendChild(makeCopyableBlock(subjectFilled, 'Subject line'));
  }
  const bodyFilled = fillTemplate(tpl.body, ctx);
  out.appendChild(makeCopyableBlock(bodyFilled, tpl.label));
}

function generateCaptionOutput() {
  const ctx = getTplContext();
  const out = document.getElementById('tplCaptionOutput');
  out.innerHTML = '';
  CAPTION_TEMPLATES.forEach(group => {
    const title = document.createElement('div');
    title.className = 'tpl-format-title';
    title.textContent = group.format;
    out.appendChild(title);
    const isTwoFloor = group.format.indexOf('Two-floor') > -1;
    group.lines.forEach((line, i) => {
      const filled = isTwoFloor ? fillTwoFloorTemplate(line, ctx) : fillTemplate(line, ctx);
      out.appendChild(makeCopyableBlock(filled, 'Option ' + (i + 1)));
    });
  });
}

function renderCarouselIdeas() {
  const filterEl = document.getElementById('tplCarouselFilter');
  const filter = filterEl ? filterEl.value.trim().toLowerCase() : '';
  const out = document.getElementById('tplCarouselOutput');
  if (!out) return;
  out.innerHTML = '';
  CAROUSEL_IDEAS.forEach(group => {
    const pillarMatches = group.pillar.toLowerCase().includes(filter);
    const matchingIdeas = filter && !pillarMatches
      ? group.ideas.filter(idea => idea.toLowerCase().includes(filter))
      : group.ideas;
    if (filter && !pillarMatches && matchingIdeas.length === 0) return;

    const title = document.createElement('div');
    title.className = 'tpl-pillar-title';
    title.textContent = group.pillar + ' (' + matchingIdeas.length + ')';
    out.appendChild(title);

    matchingIdeas.forEach(idea => {
      const row = document.createElement('div');
      row.className = 'tpl-idea-row';
      const text = document.createElement('span');
      text.textContent = idea;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'ot-mini-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = () => copyText(idea, copyBtn);
      row.appendChild(text);
      row.appendChild(copyBtn);
      out.appendChild(row);
    });
  });
  if (!out.innerHTML) {
    out.innerHTML = '<div class="ot-empty">No ideas match that search</div>';
  }
}

function buildFullCard(clip, forceExpanded) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-highlight-id', clip.id);

  const isCompact = !forceExpanded && compactCardIds.has(clip.id);

  const top = document.createElement('div');
  top.className = 'card-top';
  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = clip.desc;
  const topRight = document.createElement('div');
  topRight.className = 'card-top-right';
  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + clip.status;
  stamp.textContent = STATUS_LABELS[clip.status];
  topRight.appendChild(stamp);

  if (!forceExpanded) {
    const expandBtn = document.createElement('button');
    expandBtn.className = 'expand-toggle-btn';
    expandBtn.innerHTML = isCompact ? '▾' : '▴';
    expandBtn.title = isCompact ? 'Expand' : 'Compact';
    expandBtn.onclick = (e) => {
      e.stopPropagation();
      if (isCompact) compactCardIds.delete(clip.id); else compactCardIds.add(clip.id);
      render();
    };
    topRight.appendChild(expandBtn);
  }

  const trashBtn = document.createElement('button');
  trashBtn.className = 'trash-btn';
  trashBtn.innerHTML = '🗑';
  trashBtn.title = 'Remove';
  trashBtn.onclick = () => { removeClip(clip.id); closeCardModal(); };
  topRight.appendChild(trashBtn);
  top.appendChild(desc);
  top.appendChild(topRight);
  card.appendChild(top);

  if (isCompact) {
    card.classList.add('card-compact');
    return card;
  }

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = 'Logged ' + timeAgo(clip.created);
  card.appendChild(meta);

  const platformLabel = document.createElement('div');
  platformLabel.className = 'field-label';
  platformLabel.style.marginTop = '16px';
  platformLabel.textContent = 'Platform';
  card.appendChild(platformLabel);

  if (!clip.platform) clip.platform = 'Both';
  const platformRow = document.createElement('div');
  platformRow.className = 'platform-row';
  PLATFORMS.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'platform-chip' + (clip.platform === p ? ' selected' : '');
    chip.textContent = p;
    chip.onclick = () => { setPlatform(clip.id, p); refreshOpenModal(); };
    platformRow.appendChild(chip);
  });
  card.appendChild(platformRow);

  const toneLabel = document.createElement('div');
  toneLabel.className = 'field-label';
  toneLabel.style.marginTop = '16px';
  toneLabel.textContent = 'Tone / vibe';
  card.appendChild(toneLabel);

  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const toneRow = document.createElement('div');
  toneRow.className = 'tone-row';
  TONES.forEach(tone => {
    const chip = document.createElement('div');
    chip.className = 'tone-chip' + (clip.selectedTones.includes(tone) ? ' selected' : '');
    chip.textContent = tone;
    chip.onclick = () => { toggleTone(clip.id, tone); refreshOpenModal(); };
    toneRow.appendChild(chip);
  });
  card.appendChild(toneRow);

  const brandLabel = document.createElement('div');
  brandLabel.className = 'field-label';
  brandLabel.style.marginTop = '16px';
  brandLabel.textContent = 'Brand (optional)';
  card.appendChild(brandLabel);

  const brandSelect = document.createElement('select');
  brandSelect.className = 'app-input';
  const noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '— none —';
  brandSelect.appendChild(noneOpt);
  brands.filter(b => b.category !== 'Pinned').forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = b.name;
    if (clip.brandId === b.id) opt.selected = true;
    brandSelect.appendChild(opt);
  });
  brandSelect.onchange = () => {
    clip.brandId = brandSelect.value;
    saveClips(clip.id);
    refreshOpenModal();
  };
  card.appendChild(brandSelect);

  const dateLabel = document.createElement('div');
  dateLabel.className = 'field-label';
  dateLabel.style.marginTop = '16px';
  dateLabel.textContent = 'Date';
  card.appendChild(dateLabel);
  card.appendChild(buildDatePillForClip(clip));

  const linkLabel = document.createElement('div');
  linkLabel.className = 'field-label';
  linkLabel.style.marginTop = '16px';
  linkLabel.textContent = 'Video link';
  card.appendChild(linkLabel);

  const linkRow = document.createElement('div');
  linkRow.className = 'link-row';
  const linkInput = document.createElement('input');
  linkInput.type = 'url';
  linkInput.className = 'app-input';
  linkInput.placeholder = '🔗 Google Photos link (optional)';
  linkInput.value = clip.videoLink || '';
  linkInput.onchange = () => {
    clip.videoLink = linkInput.value.trim();
    saveClips(clip.id);
    refreshOpenModal();
  };
  linkRow.appendChild(linkInput);
  if (clip.videoLink) {
    const openLink = document.createElement('a');
    openLink.className = 'link-open-btn';
    openLink.href = clip.videoLink;
    openLink.target = '_blank';
    openLink.rel = 'noopener noreferrer';
    openLink.textContent = 'Open ↗';
    linkRow.appendChild(openLink);
  }
  card.appendChild(linkRow);

  const bottomRow = document.createElement('div');
  bottomRow.className = 'card-bottom-row';

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const select = document.createElement('select');
  STATUSES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = STATUS_LABELS[s];
    if (s === clip.status) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = () => { updateStatus(clip.id, select.value); refreshOpenModal(); };
  actions.appendChild(select);
  bottomRow.appendChild(actions);

  const genBtn = document.createElement('button');
  genBtn.className = 'gen-caption-btn';
  genBtn.innerHTML = loadingCaptions[clip.id] ? '' : (clip.captions ? 'Regenerate captions' : 'Generate captions');
  if (loadingCaptions[clip.id]) {
    genBtn.disabled = true;
    genBtn.innerHTML = 'Writing <span class="spinner"></span>';
  }
  genBtn.onclick = () => generateCaptions(clip.id);
  bottomRow.appendChild(genBtn);

  card.appendChild(bottomRow);

  if (clip.unsynced) {
    const warn = document.createElement('div');
    warn.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; padding:8px 12px; border:1px solid var(--rust); border-radius:10px; background:color-mix(in srgb, var(--rust) 10%, transparent);';
    const warnText = document.createElement('span');
    warnText.style.cssText = 'font-family:\'IBM Plex Mono\',monospace; font-size:10.5px; color:var(--rust);';
    warnText.textContent = '⚠ Not saved: ' + (clip.saveError || 'unknown error');
    const retryBtn = document.createElement('button');
    retryBtn.className = 'ghost';
    retryBtn.style.cssText = 'padding:5px 10px; font-size:10px; flex-shrink:0;';
    retryBtn.textContent = 'Retry';
    retryBtn.onclick = async () => { await saveClips(clip.id); refreshOpenModal(); render(); };
    warn.appendChild(warnText);
    warn.appendChild(retryBtn);
    card.appendChild(warn);
  }

  if (clip.captions) {
    const isCollapsed = collapsedCaptionIds.has(clip.id);
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'captions-toggle';
    toggleBtn.innerHTML = isCollapsed ? '▸ Show captions' : '▾ Hide captions';
    toggleBtn.onclick = () => {
      if (isCollapsed) collapsedCaptionIds.delete(clip.id); else collapsedCaptionIds.add(clip.id);
      render();
    };
    card.appendChild(toggleBtn);

    const box = document.createElement('div');
    box.className = 'captions-box';
    if (isCollapsed) box.style.display = 'none';

    if (clip.captions.hook) {
      const hookP = document.createElement('div');
      hookP.className = 'hook-line';
      hookP.textContent = '"' + clip.captions.hook + '"';
      box.appendChild(hookP);
    }

    const usedTones = clip.captionTones || [];
    const hashtags = clip.captions.hashtags || '';
    (clip.captions.captions || []).forEach((cap, i) => {
      const optDiv = document.createElement('div');
      optDiv.className = 'caption-opt';
      const topRow = document.createElement('div');
      topRow.className = 'caption-opt-top';
      const tag = document.createElement('span');
      tag.className = 'copy-tag';
      tag.textContent = usedTones[i] ? usedTones[i] : 'Option ' + (i+1);
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy with tags';
      copyBtn.onclick = () => copyText(hashtags ? (cap + '\n\n' + hashtags) : cap, copyBtn);
      topRow.appendChild(tag);
      topRow.appendChild(copyBtn);
      optDiv.appendChild(topRow);
      const capText = document.createElement('div');
      capText.textContent = cap;
      optDiv.appendChild(capText);
      box.appendChild(optDiv);
    });

    if (hashtags) {
      const hashDiv = document.createElement('div');
      hashDiv.className = 'hashtags';
      hashDiv.textContent = hashtags + '  (copied automatically with each caption above)';
      box.appendChild(hashDiv);
    }

    card.appendChild(box);
  }

  return card;
}

function buildGridTile(clip) {
  const tile = document.createElement('div');
  tile.className = 'grid-tile';
  tile.setAttribute('data-highlight-id', clip.id);

  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + clip.status;
  stamp.textContent = STATUS_LABELS[clip.status];
  tile.appendChild(stamp);

  if (clip.unsynced) {
    const unsyncedBadge = document.createElement('div');
    unsyncedBadge.style.cssText = 'font-family:\'IBM Plex Mono\',monospace; font-size:9px; color:var(--rust); margin-top:4px;';
    unsyncedBadge.textContent = '⚠ not saved';
    tile.appendChild(unsyncedBadge);
  }

  const desc = document.createElement('div');
  desc.className = 'grid-tile-desc';
  desc.textContent = clip.desc;
  tile.appendChild(desc);

  if (clip.brandId) {
    const b = brands.find(x => x.id === clip.brandId);
    if (b) {
      const brandTag = document.createElement('div');
      brandTag.style.cssText = 'font-family:\'IBM Plex Mono\',monospace; font-size:9.5px; color:var(--moss-dark); margin-top:-4px; margin-bottom:6px;';
      brandTag.textContent = '🏷 ' + b.name;
      tile.insertBefore(brandTag, desc.nextSibling);
    }
  }

  const footer = document.createElement('div');
  footer.className = 'grid-tile-footer';
  let footerText;
  if (clip.scheduledDate) {
    footerText = '📅 ' + formatDateLong(clip.scheduledDate);
  } else if (clip.captions) {
    footerText = '💬 tap to see all captions';
  } else {
    footerText = timeAgo(clip.created);
  }
  if (clip.videoLink) footerText = '🔗 ' + footerText;
  footer.textContent = footerText;
  tile.appendChild(footer);

  tile.onclick = () => openCardModal(clip.id);
  return tile;
}

function getFilteredClips() {
  let list = clips;
  if (activeFilter !== 'all') list = list.filter(c => c.status === activeFilter);
  if (activeBrandFilter) list = list.filter(c => c.brandId === activeBrandFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c => {
      if (c.desc && c.desc.toLowerCase().includes(q)) return true;
      if (c.captions) {
        if (c.captions.hook && c.captions.hook.toLowerCase().includes(q)) return true;
        if (Array.isArray(c.captions.captions) && c.captions.captions.some(cap => cap.toLowerCase().includes(q))) return true;
      }
      return false;
    });
  }
  return list;
}

function renderCardListOnly() {
  const list = document.getElementById('cardList');
  if (!list) return;
  list.innerHTML = '';
  list.className = 'cardlist-grid';
  const filtered = getFilteredClips();

  if (filtered.length === 0) {
    if (isOfflinePreview) {
      list.innerHTML = '<div class="empty-state">Preview mode: can\'t reach the cloud database here, so nothing\'s loaded. Add a caption to test the UI — it\'ll stay local to this preview. Your real data is safe and will show up on the deployed site.</div>';
    } else if (searchQuery || activeBrandFilter) {
      list.innerHTML = '<div class="empty-state">Nothing matches that search/filter.</div>';
    } else {
      list.innerHTML = '<div class="empty-state">No captions logged yet. The field is quiet.</div>';
    }
  } else {
    filtered.forEach(clip => {
      list.appendChild(buildGridTile(clip));
    });
  }
}

function renderCalendar() {
  const container = document.getElementById('calendarView');
  const now = new Date();
  const viewDate = new Date(now.getFullYear(), now.getMonth() + calMonthOffset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthLabel = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('-');

  const clipsByDate = {};
  clips.forEach(c => {
    if (c.scheduledDate) {
      if (!clipsByDate[c.scheduledDate]) clipsByDate[c.scheduledDate] = [];
      clipsByDate[c.scheduledDate].push(c);
    }
  });

  let html = '<div class="cal-header">';
  html += '<h2>' + monthLabel + '</h2>';
  html += '<div class="nav-btns"><button id="calPrev">‹ Prev</button><button id="calToday">Today</button><button id="calNext">Next ›</button></div>';
  html += '</div>';
  html += '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += '<div class="cal-dow">' + d + '</div>'; });

  for (let i = 0; i < firstDow; i++) html += '<div class="cal-cell empty"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const isToday = dateStr === todayStr;
    html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
    html += '<div class="cal-daynum">' + day + '</div>';
    (clipsByDate[dateStr] || []).forEach(c => {
      html += '<div class="cal-post ' + c.status + '" data-clip-id="' + c.id + '" title="' + c.desc.replace(/"/g,'&quot;') + '">' + escapeHtml(c.desc) + '</div>';
    });
    html += '</div>';
  }

  const totalCells = firstDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += '<div class="cal-cell empty"></div>';
  html += '</div>';

  const numWeeks = Math.ceil((firstDow + daysInMonth) / 7);
  container.innerHTML = html;
  container.style.setProperty('--cal-weeks', numWeeks);

  document.getElementById('calPrev').onclick = () => { calMonthOffset--; renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonthOffset++; renderCalendar(); };
  document.getElementById('calToday').onclick = () => { calMonthOffset = 0; renderCalendar(); };

  container.querySelectorAll('.cal-post').forEach(el => {
    el.onclick = () => openCardModal(el.dataset.clipId);
  });
}

loadTheme();
loadClips();
loadBrands();
initTemplatesSection();

document.getElementById('brandFilterSelect').addEventListener('change', (e) => {
  activeBrandFilter = e.target.value;
  renderCardListOnly();
});
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderCardListOnly();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { loadClips(); loadBrands(); }
});
window.addEventListener('focus', () => { loadClips(); loadBrands(); });
window.addEventListener('resize', () => { render(); });

</script>
</body>
</html>
