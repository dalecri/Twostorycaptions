<title>Specimen Log — TwoStoryTails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE8D8;
    --paper-light: #F8F4EA;
    --ink: #2B3532;
    --ink-soft: #565f56;
    --moss: #6B7A5E;
    --moss-dark: #4d5943;
    --rust: #A6544A;
    --line: #cdc2a4;
    --stamp-idea: #8a8478;
    --stamp-filmed: #7c8a6a;
    --stamp-captioned: #b08a4a;
    --stamp-scheduled: #4a7a8a;
    --stamp-posted: #4d5943;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.02), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.02), transparent 40%);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  header.masthead .title-block h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header.masthead .title-block p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  header.masthead .catalog-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .entry-form {
    background: var(--paper-light);
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 30px;
    position: relative;
  }
  .entry-form::before {
    content: "NEW SPECIMEN";
    position: absolute;
    top: -10px;
    left: 14px;
    background: var(--paper);
    padding: 0 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--moss-dark);
  }
  .entry-form textarea, .entry-form select {
    width: 100%;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    padding: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    margin-bottom: 10px;
    resize: vertical;
  }
  .entry-form select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    width: auto;
    display: inline-block;
    margin-right: 10px;
  }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-light);
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--moss-dark); }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  button.ghost:hover { background: var(--ink); color: var(--paper-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .filter-row button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
  }
  .filter-row button.active {
    background: var(--ink);
    color: var(--paper-light);
    border-color: var(--ink);
  }

  .card {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-left: 4px solid var(--moss);
    padding: 16px 18px;
    margin-bottom: 14px;
    position: relative;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .card-desc {
    font-size: 16px;
    line-height: 1.45;
    flex: 1;
  }
  .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border: none;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: color-mix(in srgb, currentColor 16%, var(--paper-light));
  }
  .stamp::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .stamp.idea { color: var(--stamp-idea); }
  .stamp.filmed { color: var(--stamp-filmed); }
  .stamp.captioned { color: var(--stamp-captioned); }
  .stamp.scheduled { color: var(--stamp-scheduled); }
  .stamp.posted { color: var(--stamp-posted); }

  .card-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .card-actions select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .card-actions button { padding: 6px 10px; font-size: 10.5px; }
  .remove-btn {
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
  }
  .remove-btn:hover { background: var(--rust); color: #fff; }

  .captions-box {
    margin-top: 12px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  .caption-opt {
    background: #fff;
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
  }
  .caption-opt-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .caption-opt .copy-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--moss-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .copy-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--moss);
    background: transparent;
    color: var(--moss-dark);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.12s ease;
  }
  .copy-btn:hover { background: var(--moss); color: #fff; }
  .copy-btn.just-copied { background: var(--moss); color: #fff; border-color: var(--moss); }
  .hook-line { font-style: italic; color: var(--moss-dark); font-family: 'Fraunces', serif; }
  .hashtags-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  .hashtags { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); flex: 1; }

  .tone-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .tone-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tone-chip:hover { border-color: var(--moss); }
  .tone-chip.selected {
    background: var(--moss);
    border-color: var(--moss);
    color: #fff;
  }

  .platform-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .platform-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px dashed var(--rust);
    background: transparent;
    color: var(--rust);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.12s ease;
  }
  .platform-chip:hover { background: color-mix(in srgb, var(--rust) 12%, transparent); }
  .platform-chip.selected {
    background: var(--rust);
    border-style: solid;
    border-color: var(--rust);
    color: #fff;
  }

  .view-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .view-toggle button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 7px 14px;
  }
  .view-toggle button.active {
    background: var(--ink);
    color: var(--paper-light);
  }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

<script>
const STATUSES = ['idea','filmed','captioned','scheduled','posted'];
const STATUS_LABELS = { idea:'Idea', filmed:'Filmed', captioned:'Captioned', scheduled:'Scheduled', posted:'Posted' };
const TONES = ['Deadpan nature-doc', 'Funny', 'Educational', 'Meme-style', 'Relatable', 'Multi-cat tie-in', 'Wholesome'];
const PLATFORMS = ['Instagram', 'TikTok', 'Both'];
let clips = [];
let activeFilter = 'all';
let loadingCaptions = {};
let newClipTones = ['Deadpan nature-doc'];
let currentView = 'log';
let calMonthOffset = 0;
let currentTheme = 'berry';
let isOfflinePreview = false;

const THEMES = {
  berry: {
    label: 'Bubblegum & Dark Berry',
    swatches: ['#E9B0C8', '#6E1E3A'],
    vars: {
      '--paper': '#F5E3EC',
      '--paper-light': '#FCF4F8',
      '--ink': '#4A1830',
      '--ink-soft': '#8C5468',
      '--moss': '#6E1E3A',
      '--moss-dark': '#4E1226',
      '--rust': '#C77A93',
      '--line': '#E3C1D3',
      '--stamp-idea': '#A9788C',
      '--stamp-filmed': '#8C5468',
      '--stamp-captioned': '#B2724A',
      '--stamp-scheduled': '#7A5A8C',
      '--stamp-posted': '#4E1226'
    }
  },
  citrus: {

    swatches: ['#D76A4C', '#FADD8B'],
    vars: {
      '--paper': '#FBEEDA',
      '--paper-light': '#FFF8EB',
      '--ink': '#5A3A1E',
      '--ink-soft': '#9C6B3F',
      '--moss': '#D76A4C',
      '--moss-dark': '#B34F35',
      '--rust': '#B5462E',
      '--line': '#EFD6A0',
      '--stamp-idea': '#B08A4F',
      '--stamp-filmed': '#C77A2F',
      '--stamp-captioned': '#D9A73E',
      '--stamp-scheduled': '#8C6B3F',
      '--stamp-posted': '#B34F35'
    }
  },
  nautical: {
    label: 'Baby Blue & Sailor Blue',
    swatches: ['#A4BDE0', '#274F8B'],
    vars: {
      '--paper': '#E7EEF8',
      '--paper-light': '#F5F9FD',
      '--ink': '#152F4D',
      '--ink-soft': '#4A6C8C',
      '--moss': '#274F8B',
      '--moss-dark': '#1B3A66',
      '--rust': '#A4573F',
      '--line': '#C3D5EC',
      '--stamp-idea': '#6E8DAE',
      '--stamp-filmed': '#4A6C8C',
      '--stamp-captioned': '#B08A4F',
      '--stamp-scheduled': '#274F8B',
      '--stamp-posted': '#1B3A66'
    }
  },
  forest: {
    label: 'Forest & Limeade',
    swatches: ['#25533F', '#C9D763'],
    vars: {
      '--paper': '#E9F0DC',
      '--paper-light': '#F5F9EC',
      '--ink': '#1C3226',
      '--ink-soft': '#4C6350',
      '--moss': '#25533F',
      '--moss-dark': '#173626',
      '--rust': '#8C6A2F',
      '--line': '#CFE0AE',
      '--stamp-idea': '#6B8067',
      '--stamp-filmed': '#4C7A50',
      '--stamp-captioned': '#9C8A3F',
      '--stamp-scheduled': '#3F6B7A',
      '--stamp-posted': '#173626'
    }
  }
};

function applyTheme(name, skipSave) {
  currentTheme = name;
  const theme = THEMES[name];
  const root = document.documentElement.style;
  Object.entries(theme.vars).forEach(([k, v]) => root.setProperty(k, v));
  document.getElementById('themeBtnDot').style.background = theme.swatches[1];
  renderThemeDropdown();
  if (!skipSave) {
    try { localStorage.setItem('ttt-theme', name); } catch (e) {}
  }
}

function renderThemeDropdown() {
  const dd = document.getElementById('themeDropdown');
  dd.innerHTML = '';
  Object.entries(THEMES).forEach(([key, theme]) => {
    const opt = document.createElement('div');
    opt.className = 'theme-option' + (currentTheme === key ? ' selected' : '');
    const pair = document.createElement('div');
    pair.className = 'theme-swatch-pair';
    theme.swatches.forEach(c => {
      const half = document.createElement('div');
      half.style.background = c;
      pair.appendChild(half);
    });
    const label = document.createElement('div');
    label.className = 'theme-option-label';
    label.textContent = theme.label;
    opt.appendChild(pair);
    opt.appendChild(label);
    opt.onclick = () => { applyTheme(key); document.getElementById('themeDropdown').classList.remove('open'); };
    dd.appendChild(opt);
  });
}

document.getElementById('themeBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('themeDropdown').classList.toggle('open');
});
document.addEventListener('click', () => {
  document.getElementById('themeDropdown').classList.remove('open');
});

let newClipPlatform = 'Both';

function toggleNewClipTone(tone) {
  const idx = newClipTones.indexOf(tone);
  if (idx > -1) newClipTones.splice(idx, 1);
  else newClipTones.push(tone);
  renderNewClipTones();
}

function setNewClipPlatform(p) {
  newClipPlatform = p;
  renderNewClipPlatform();
}

function renderNewClipPlatform() {
  const row = document.getElementById('newClipPlatformRow');
  row.innerHTML = '';
  PLATFORMS.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'platform-chip' + (newClipPlatform === p ? ' selected' : '');
    chip.textContent = p;
    chip.onclick = () => setNewClipPlatform(p);
    row.appendChild(chip);
  });
}

function renderNewClipTones() {
  const row = document.getElementById('newClipToneRow');
  row.innerHTML = '';
  TONES.forEach(tone => {
    const chip = document.createElement('div');
    chip.className = 'tone-chip' + (newClipTones.includes(tone) ? ' selected' : '');
    chip.textContent = tone;
    chip.onclick = () => toggleNewClipTone(tone);
    row.appendChild(chip);
  });
}

function toggleTone(clipId, tone) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const idx = clip.selectedTones.indexOf(tone);
  if (idx > -1) clip.selectedTones.splice(idx, 1);
  else clip.selectedTones.push(tone);
  saveClips();
  render();
}

function setPlatform(clipId, platform) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  clip.platform = platform;
  saveClips();
  render();

Critical rule: never include the account's own name or handle anywhere in the hook, captions, or hashtags. The account is small and growing, so its own name has no search reach — do not waste a hashtag or caption line on it. Every hashtag must be a real, widely-searched tag relevant to cats, pets, the specific breeds involved, or cat humor/behavior — chosen purely to maximize discoverability for people who don't yet follow the account.

Platform: ${platform}

The user has selected the following tone(s)/vibe(s) for this specific caption batch:

If multiple tones are selected, write one caption option per tone (in the order given) so the user can compare vibes side by side. If only one tone is selected, write 3 options in that tone.

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:

function copyText(text, el) {
  const showCopied = () => {
    const orig = el.textContent;
    el.textContent = 'Copied ✓';
    el.classList.add('just-copied');
    setTimeout(() => { el.textContent = orig; el.classList.remove('just-copied'); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onSuccess) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    onSuccess();
  } catch (e) {
    console.error('Copy failed', e);
  }
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return '1 day ago';
  return days + ' days ago';
}

function formatDateLong(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

    html += '<div class="cal-cell empty"></div>';
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const isToday = dateStr === todayStr;
    html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
    html += '<div class="cal-daynum">' + day + '</div>';
    (clipsByDate[dateStr] || []).forEach(c => {
      html += '<div class="cal-post ' + c.status + '" data-clip-id="' + c.id + '" title="' + c.desc.replace(/"/g,'&quot;') + '">' + c.desc + '</div>';
    });
    html += '</div>';
  }

  const totalCells = firstDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) {
    html += '<div class="cal-cell empty"></div>';
  }
  html += '</div>';

  container.innerHTML = html;

  document.getElementById('calPrev').onclick = () => { calMonthOffset--; renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonthOffset++; renderCalendar(); };
  document.getElementById('calToday').onclick = () => { calMonthOffset = 0; renderCalendar(); };

  container.querySelectorAll('.cal-post').forEach(el => {
    el.onclick = () => openCardModal(el.dataset.clipId);
  });
}

document.getElementById('addBtn').addEventListener('click', addClip);
document.getElementById('fabAddBtn').addEventListener('click', openEntrySheet);
document.getElementById('sheetCloseBtn').addEventListener('click', closeEntrySheet);
document.getElementById('sheetBackdrop').addEventListener('click', closeEntrySheet);
document.getElementById('descInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.metaKey) addClip();
});

function loadTheme() {
  let saved = 'berry';
  try {
    saved = localStorage.getItem('ttt-theme') || 'berry';
  } catch (e) {}
  applyTheme(THEMES[saved] ? saved : 'berry', true);
}

renderNewClipTones();
renderNewClipPlatform();
loadTheme();
loadClips();

document.getElementById('syncNowBtn').addEventListener('click', () => {
  if (document.getElementById('cardModalOverlay').classList.contains('open')) closeCardModal();
  loadClips();
});

// Auto-refresh from the cloud whenever the tab/app regains focus or visibility,
// so switching back from another device's changes shows up without manual action.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadClips();
});
window.addEventListener('focus', () => loadClips());

</script>
</body>
</html>
