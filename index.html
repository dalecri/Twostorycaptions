<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Specimen Log — TwoStoryTails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE8D8;
    --paper-light: #F8F4EA;
    --ink: #2B3532;
    --ink-soft: #565f56;
    --moss: #6B7A5E;
    --moss-dark: #4d5943;
    --rust: #A6544A;
    --line: #cdc2a4;
    --stamp-idea: #8a8478;
    --stamp-filmed: #7c8a6a;
    --stamp-captioned: #b08a4a;
    --stamp-scheduled: #4a7a8a;
    --stamp-posted: #4d5943;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.02), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.02), transparent 40%);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header.masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  header.masthead .title-block h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header.masthead .title-block p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  header.masthead .catalog-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .entry-form {
    background: var(--paper-light);
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 30px;
    position: relative;
  }
  .entry-form::before {
    content: "NEW SPECIMEN";
    position: absolute;
    top: -10px;
    left: 14px;
    background: var(--paper);
    padding: 0 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--moss-dark);
  }
  .entry-form textarea, .entry-form select {
    width: 100%;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    padding: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    margin-bottom: 10px;
    resize: vertical;
  }
  .entry-form select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    width: auto;
    display: inline-block;
    margin-right: 10px;
  }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-light);
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--moss-dark); }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  button.ghost:hover { background: var(--ink); color: var(--paper-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .filter-row button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
  }
  .filter-row button.active {
    background: var(--ink);
    color: var(--paper-light);
    border-color: var(--ink);
  }

  .card {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-left: 4px solid var(--moss);
    padding: 16px 18px;
    margin-bottom: 14px;
    position: relative;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .card-desc {
    font-size: 16px;
    line-height: 1.45;
    flex: 1;
  }
  .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border: none;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: color-mix(in srgb, currentColor 16%, var(--paper-light));
  }
  .stamp::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .stamp.idea { color: var(--stamp-idea); }
  .stamp.filmed { color: var(--stamp-filmed); }
  .stamp.captioned { color: var(--stamp-captioned); }
  .stamp.scheduled { color: var(--stamp-scheduled); }
  .stamp.posted { color: var(--stamp-posted); }

  .card-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .card-actions select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .card-actions button { padding: 6px 10px; font-size: 10.5px; }
  .remove-btn {
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
  }
  .remove-btn:hover { background: var(--rust); color: #fff; }

  .captions-box {
    margin-top: 12px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  .caption-opt {
    background: #fff;
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
  }
  .caption-opt .copy-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--moss-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .hook-line { font-style: italic; color: var(--moss-dark); font-family: 'Fraunces', serif; }
  .hashtags { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  .tone-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .tone-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tone-chip:hover { border-color: var(--moss); }
  .tone-chip.selected {
    background: var(--moss);
    border-color: var(--moss);
    color: #fff;
  }

  .platform-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .platform-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px dashed var(--rust);
    background: transparent;
    color: var(--rust);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.12s ease;
  }
  .platform-chip:hover { background: color-mix(in srgb, var(--rust) 12%, transparent); }
  .platform-chip.selected {
    background: var(--rust);
    border-style: solid;
    border-color: var(--rust);
    color: #fff;
  }

  .view-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .view-toggle button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 7px 14px;
  }
  .view-toggle button.active {
    background: var(--ink);
    color: var(--paper-light);
  }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 20px;
    margin: 0;
  }
  .cal-header .nav-btns { display: flex; gap: 8px; }
  .cal-header .nav-btns button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 5px 12px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .cal-dow {
    background: var(--ink);
    color: var(--paper-light);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    padding: 6px 2px;
  }
  .cal-cell {
    background: var(--paper-light);
    min-height: 92px;
    padding: 6px;
    position: relative;
  }
  .cal-cell.empty { background: var(--paper); }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--moss); }
  .cal-daynum {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .cal-post {
    font-size: 10.5px;
    line-height: 1.3;
    background: #fff;
    border-left: 3px solid var(--moss);
    padding: 3px 5px;
    margin-bottom: 3px;
    cursor: pointer;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cal-post.posted { border-left-color: var(--stamp-posted); opacity: 0.7; }
  .cal-post.scheduled { border-left-color: var(--stamp-scheduled); }
  .cal-post.captioned { border-left-color: var(--stamp-captioned); }

  .date-picker-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .date-picker-row input[type="date"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .scheduled-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--stamp-scheduled);
    margin-top: 6px;
  }

  .theme-picker {
    position: relative;
  }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-light);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 7px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .theme-btn:hover { background: var(--ink); color: var(--paper-light); }
  .theme-swatch-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15) inset;
  }
  .theme-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--paper-light);
    border: 1px solid var(--ink);
    width: 250px;
    z-index: 20;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.08);
  }
  .theme-dropdown.open { display: block; }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .theme-option:last-child { border-bottom: none; }
  .theme-option:hover { background: var(--paper); }
  .theme-option.selected { background: var(--paper); font-weight: 600; }
  .theme-swatch-pair {
    display: flex;
    width: 32px;
    height: 20px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }
  .theme-swatch-pair div { flex: 1; }
  .theme-option-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink);
  }

  .cardlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
    align-items: stretch;
  }
  .grid-tile {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-top: 4px solid var(--moss);
    aspect-ratio: 1 / 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .grid-tile:hover {
    transform: translateY(-2px);
    box-shadow: 3px 4px 0 rgba(0,0,0,0.06);
  }
  .grid-tile-desc {
    font-size: 13px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 8px 0;
  }
  .grid-tile-footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }
  @media (max-width: 900px) {
    .cardlist-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .grid-tile-desc { font-size: 12px; -webkit-line-clamp: 4; }
  }
  @media (max-width: 560px) {
    .cardlist-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-tile { padding: 9px; }
    .grid-tile-desc { font-size: 11.5px; -webkit-line-clamp: 4; margin: 6px 0; }
    .grid-tile-footer { font-size: 8.5px; }
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--paper-light);
    border: 1px solid var(--ink);
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 50px 26px 26px;
    position: relative;
  }
  .modal-box .card {
    border: none;
    border-left: none;
    padding: 0;
    margin: 0;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    z-index: 2;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
  }
  .loading-dots::after {
    content: '...';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

  footer.tally {
    margin-top: 30px;
    border-top: 2px solid var(--ink);
    padding-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
  }

  /* ===== Responsive pass: tablet ===== */
  @media (max-width: 820px) {
    body { padding: 24px 16px 60px; }
    header.masthead { flex-wrap: wrap; gap: 12px; }
    .card-actions { row-gap: 8px; }
  }

  /* Bottom tab bar, FAB, and sheet chrome are mobile-only; hidden by default */
  .bottom-tab-bar, .fab-add, .sheet-header, .sheet-backdrop { display: none; }

  /* ===== Responsive pass: phone — app shell overhaul ===== */
  @media (max-width: 600px) {
    body { padding: 16px 12px calc(84px + env(safe-area-inset-bottom)); }
    .wrap { max-width: 100%; }

    header.masthead {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 12px;
    }
    header.masthead .title-block h1 { font-size: 22px; }
    header.masthead > div { width: 100%; justify-content: space-between; }

    /* Entry form becomes a bottom sheet, opened via FAB */
    .entry-form {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 95;
      margin: 0;
      max-height: 82vh;
      overflow-y: auto;
      border: none;
      border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.18);
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .entry-form.sheet-open { transform: translateY(0); }
    .entry-form::before { display: none; }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 17px;
      color: var(--ink);
      padding-bottom: 10px;
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--line);
    }
    .sheet-close {
      background: transparent;
      border: none;
      color: var(--ink-soft);
      font-size: 15px;
      padding: 4px 8px;
    }
    .entry-form textarea { font-size: 16px; }
    .entry-form > div:last-child { flex-direction: column; }
    .entry-form > div:last-child button { width: 100%; min-height: 44px; }
    .tone-row, .platform-row { gap: 5px; }
    .tone-chip, .platform-chip { font-size: 9.5px; padding: 6px 10px; }

    .sheet-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 92;
    }
    .sheet-backdrop.open { display: block; }

    /* FAB */
    .fab-add {
      display: flex;
      position: fixed;
      right: 18px;
      bottom: calc(72px + env(safe-area-inset-bottom));
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--moss);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      align-items: center;
      justify-content: center;
      border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 93;
    }
    .fab-add:active { background: var(--moss-dark); }

    /* Bottom tab bar replaces top view-toggle */
    .view-toggle { display: none; }
    .bottom-tab-bar {
      display: flex;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--paper-light);
      border-top: 1px solid var(--line);
      z-index: 90;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 9px 4px 7px;
      background: transparent;
      border: none;
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
    }
    .bottom-tab-icon { font-size: 18px; }
    .bottom-tab-label { font-size: 9.5px; letter-spacing: 0.4px; text-transform: uppercase; }
    .bottom-tab.active { color: var(--moss-dark); }
    .bottom-tab.active .bottom-tab-icon { transform: scale(1.1); }

    /* Sticky, compact status filter directly under header */
    .filter-row {
      position: sticky;
      top: 0;
      background: var(--paper);
      z-index: 20;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 12px 10px;
      margin: 0 -12px 16px;
    }
    .filter-row button { flex-shrink: 0; min-height: 34px; font-size: 10px; }

    .card { padding: 14px; }
    .card-top { flex-direction: column; align-items: flex-start; gap: 8px; }
    .card-desc { font-size: 15px; }

    .card-actions { flex-direction: column; align-items: stretch; }
    .card-actions select, .card-actions button, .date-picker-row { width: 100%; }
    .card-actions select { min-height: 42px; font-size: 15px; }
    .card-actions button { min-height: 42px; }
    .date-picker-row input[type="date"] { flex: 1; min-height: 42px; font-size: 15px; }

    .caption-opt { font-size: 13.5px; }

    .theme-dropdown { right: 0; width: min(230px, calc(100vw - 32px)); }

    .modal-box { padding: 60px 18px 20px; max-height: 90vh; }
    .modal-box h3 { font-size: 19px; padding-right: 50px; }
    .modal-overlay { padding: 0; align-items: flex-end; z-index: 94; }
    .modal-box { max-width: 100%; border-left: none; border-right: none; border-bottom: none; }

    #calendarView {
      margin: 0 -12px;
      padding: 0;
    }
    .cal-header {
      padding: 0 14px;
      margin-bottom: 10px;

<body>

<button class="fab-add" id="fabAddBtn" aria-label="Add specimen">+</button>

<script>
const STATUSES = ['idea','filmed','captioned','scheduled','posted'];
const STATUS_LABELS = { idea:'Idea', filmed:'Filmed', captioned:'Captioned', scheduled:'Scheduled', posted:'Posted' };
const TONES = ['Deadpan nature-doc', 'Funny', 'Educational', 'Meme-style', 'Relatable', 'Multi-cat tie-in', 'Wholesome'];
const PLATFORMS = ['Instagram', 'TikTok', 'Both'];
let clips = [];
let activeFilter = 'all';
let loadingCaptions = {};
let newClipTones = ['Deadpan nature-doc'];
let currentView = 'log';
let calMonthOffset = 0;
let currentTheme = 'berry';

const THEMES = {
  berry: {
    label: 'Bubblegum & Dark Berry',
    swatches: ['#E9B0C8', '#6E1E3A'],
    vars: {

  },

      '--moss': '#25533F',

      '--rust': '#8C6A2F',
      '--line': '#CFE0AE',
      '--stamp-idea': '#6B8067',
      '--stamp-filmed': '#4C7A50',

      '--stamp-posted': '#173626'
    }
  }
};

function applyTheme(name, skipSave) {
  currentTheme = name;
  const theme = THEMES[name];
  const root = document.documentElement.style;
  Object.entries(theme.vars).forEach(([k, v]) => root.setProperty(k, v));
  document.getElementById('themeBtnDot').style.background = theme.swatches[1];
  renderThemeDropdown();
  if (!skipSave) {
    try { localStorage.setItem('ttt-theme', name); } catch (e) {}
  }
}

function renderThemeDropdown() {
  const dd = document.getElementById('themeDropdown');
  dd.innerHTML = '';
  Object.entries(THEMES).forEach(([key, theme]) => {
    const opt = document.createElement('div');
    opt.className = 'theme-option' + (currentTheme === key ? ' selected' : '');
    const pair = document.createElement('div');
    pair.className = 'theme-swatch-pair';
    theme.swatches.forEach(c => {
      const half = document.createElement('div');
      half.style.background = c;
      pair.appendChild(half);
    });
    const label = document.createElement('div');
    label.className = 'theme-option-label';
    label.textContent = theme.label;
    opt.appendChild(pair);
    opt.appendChild(label);
    opt.onclick = () => { applyTheme(key); document.getElementById('themeDropdown').classList.remove('open'); };
    dd.appendChild(opt);
  });
}

document.getElementById('themeBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('themeDropdown').classList.toggle('open');
});
document.addEventListener('click', () => {
  document.getElementById('themeDropdown').classList.remove('open');
});

let newClipPlatform = 'Both';

function toggleNewClipTone(tone) {
  const idx = newClipTones.indexOf(tone);
  if (idx > -1) newClipTones.splice(idx, 1);
  else newClipTones.push(tone);
  renderNewClipTones();
}

function setNewClipPlatform(p) {
  newClipPlatform = p;
  renderNewClipPlatform();
}

function renderNewClipPlatform() {
  const row = document.getElementById('newClipPlatformRow');
  row.innerHTML = '';
  PLATFORMS.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'platform-chip' + (newClipPlatform === p ? ' selected' : '');
    chip.textContent = p;
    chip.onclick = () => setNewClipPlatform(p);
    row.appendChild(chip);
  });
}

function renderNewClipTones() {
  const row = document.getElementById('newClipToneRow');
  row.innerHTML = '';
  TONES.forEach(tone => {
    const chip = document.createElement('div');
    chip.className = 'tone-chip' + (newClipTones.includes(tone) ? ' selected' : '');
    chip.textContent = tone;
    chip.onclick = () => toggleNewClipTone(tone);
    row.appendChild(chip);
  });
}

function toggleTone(clipId, tone) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const idx = clip.selectedTones.indexOf(tone);
  if (idx > -1) clip.selectedTones.splice(idx, 1);
  else clip.selectedTones.push(tone);
  saveClips();
  render();
}

function setPlatform(clipId, platform) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  clip.platform = platform;
  saveClips();
  render();
}

const SUPABASE_URL = 'https://kumlmoecgnpkhgpxuopk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qQZRlaTbMm3kEs5n2Fikfg_K5OaciqO';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function setSyncStatus(text, isError) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--rust)' : '';
}

function rowToClip(row) {
  return {
    id: row.id,
    desc: row.desc_text,
    status: row.status,
    created: row.created,
    scheduledDate: row.scheduled_date || '',
    selectedTones: row.selected_tones || ['Deadpan nature-doc'],
    platform: row.platform || 'Both',
    captionTones: row.caption_tones || [],
    captions: row.captions || null
  };
}

function clipToRow(clip) {
  return {
    id: clip.id,
    desc_text: clip.desc,
    status: clip.status,
    created: clip.created,
    scheduled_date: clip.scheduledDate || null,
    selected_tones: clip.selectedTones || ['Deadpan nature-doc'],
    platform: clip.platform || 'Both',
    caption_tones: clip.captionTones || [],
    captions: clip.captions || null,
    updated_at: new Date().toISOString()
  };
}

async function loadClips() {
  setSyncStatus('Syncing…');
  try {
    const { data, error } = await sb.from('ttt_clips').select('*').order('created', { ascending: false });
    if (error) throw error;
    clips = (data || []).map(rowToClip);
    setSyncStatus('Synced ✓');
  } catch (e) {
    console.error('Load error', e);
    clips = [];
    setSyncStatus('Offline — changes will retry', true);
  }
  render();
}

async function saveClips() {
  if (!clips.length) return;
  try {
    const rows = clips.map(clipToRow);
    const { error } = await sb.from('ttt_clips').upsert(rows, { onConflict: 'id' });
    if (error) throw error;
    setSyncStatus('Synced ✓');
  } catch (e) {
    console.error('Save error', e);
    setSyncStatus('Sync failed — check connection', true);
  }
}

async function deleteClipRemote(id) {
  try {
    const { error } = await sb.from('ttt_clips').delete().eq('id', id);
    if (error) throw error;
  } catch (e) {
    console.error('Delete error', e);
    setSyncStatus('Delete failed — check connection', true);
  }
}

function uid() { return 'c' + Date.now() + Math.floor(Math.random()*1000); }

function addClip() {
  const desc = document.getElementById('descInput').value.trim();
  if (!desc) return;
  clips.unshift({
    id: uid(),
    desc,
    status: 'idea',
    created: new Date().toISOString(),
    captions: null,
    selectedTones: newClipTones.length ? [...newClipTones] : ['Deadpan nature-doc'],
    platform: newClipPlatform
  });
  document.getElementById('descInput').value = '';
  saveClips();
  render();
  closeEntrySheet();
}

function openEntrySheet() {
  document.getElementById('entryForm').classList.add('sheet-open');
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('descInput').focus();
}

function closeEntrySheet() {
  document.getElementById('entryForm').classList.remove('sheet-open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}

function updateStatus(id, status) {
  const c = clips.find(c => c.id === id);
  if (c) { c.status = status; saveClips(); render(); }
}

function setScheduledDate(id, dateStr) {
  const c = clips.find(c => c.id === id);
  if (!c) return;
  c.scheduledDate = dateStr;
  if (dateStr && c.status !== 'posted' && c.status !== 'scheduled') c.status = 'scheduled';
  saveClips();
  render();
}

function removeClip(id) {
  clips = clips.filter(c => c.id !== id);
  deleteClipRemote(id);
  render();
}

async function generateCaptions(id) {
  const clip = clips.find(c => c.id === id);
  if (!clip) return;
  loadingCaptions[id] = true;
  render();

  const tones = (clip.selectedTones && clip.selectedTones.length) ? clip.selectedTones : ['Deadpan nature-doc'];
  const toneGuide = {
    'Deadpan nature-doc': 'Attenborough-style narration, dry and scientific, treating mundane behavior as a serious phenomenon. No exclamation points.',
    'Funny': 'Straightforwardly comedic, punchy, built for a laugh in one read.',
    'Educational': 'Frames the moment around a real (or plausibly real) cat behavior fact, teaches the viewer something.',
    'Meme-style': 'Short, internet-native phrasing, leans on a recognizable meme format or rhythm rather than full sentences.',
    'Relatable': 'Written like a knowing aside to other pet owners, "when your cat does X" energy.',
    'Multi-cat tie-in': 'Explicitly references the dynamic or contrast between two or more of the four cats (Cali, Neo, Ramses, Diego).',
    'Wholesome': 'Warm, affectionate, sincere, no irony.'
  };
  const toneInstructions = tones.map(t => '- ' + t + ': ' + (toneGuide[t] || '')).join('\n');

  const platform = clip.platform || 'Both';
  const platformGuide = {
    'Instagram': 'Optimize for Instagram (Reels/carousel). Hashtags: 12-15 tags, a mix of broad high-volume cat/pet tags and mid-size niche tags (breed-specific, cat-humor, cat-behavior communities) to maximize discoverability for a growing account. Caption can be slightly longer (1-3 sentences).',
    'TikTok': 'Optimize for TikTok. Hashtags: 4-6 tags only, favor currently high-traffic broad tags (#fyp-style reach tags, #cats, #catsoftiktok, #catbehavior) over niche ones — TikTok discovery leans on fewer, broader tags plus the algorithm, not hashtag walls. Captions should be punchier and shorter, built to be read in under 2 seconds.',
    'Both': 'Write for cross-posting to Instagram and TikTok. Hashtags: 8-10 tags, a balanced mix of broad reach tags and a couple of niche ones that work on either platform. Keep captions short enough to work as an on-screen TikTok caption but complete enough to stand alone on Instagram.'
  };

  const systemPrompt = `You write social captions for a cat content account. The account features four cats: Cali and Neo (domestic shorthairs, downstairs territory) and Ramses (Savannah) and Diego (Bengal, upstairs territory).

Critical rule: never include the account's own name or handle anywhere in the hook, captions, or hashtags. The account is small and growing, so its own name has no search reach — do not waste a hashtag or caption line on it. Every hashtag must be a real, widely-searched tag relevant to cats, pets, the specific breeds involved, or cat humor/behavior — chosen purely to maximize discoverability for people who don't yet follow the account.

Platform: ${platform}
${platformGuide[platform]}

The user has selected the following tone(s)/vibe(s) for this specific caption batch:
${toneInstructions}

If multiple tones are selected, write one caption option per tone (in the order given) so the user can compare vibes side by side. If only one tone is selected, write 3 options in that tone.

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{
  "hook": "a short on-screen text overlay for the first 1-2 seconds, matching the dominant tone",
  "captions": ["option 1", "option 2", "option 3"],
  "hashtags": "#tag1 #tag2 #tag3 #tag4 #tag5"
}
Each caption should be 1-3 sentences. Label-free — just the caption text itself.`;

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-captions`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({
        systemPrompt,
        userMessage: `Clip description: ${clip.desc}`
      })
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error || data));
    }
    const textBlock = data.content.find(b => b.type === 'text');
    let raw = textBlock ? textBlock.text : '{}';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    clip.captions = parsed;
    clip.captionTones = tones.length > 1 ? tones : [];
    if (clip.status === 'filmed' || clip.status === 'idea') clip.status = 'captioned';
    saveClips();
  } catch (e) {
    console.error('Caption generation failed', e);
    clip.captions = { hook: '', captions: ['Could not generate captions — try again.'], hashtags: '' };
  }
  loadingCaptions[id] = false;
  render();
}

function copyText(text, el) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = el.textContent;
    el.textContent = 'Copied';
    setTimeout(() => { el.textContent = orig; }, 1200);
  }).catch(() => {});
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return '1 day ago';
  return days + ' days ago';
}

function formatDateLong(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function buildFullCard(clip) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-highlight-id', clip.id);

  const top = document.createElement('div');
  top.className = 'card-top';
  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = clip.desc;
  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + clip.status;
  stamp.textContent = STATUS_LABELS[clip.status];
  top.appendChild(desc);
  top.appendChild(stamp);
  card.appendChild(top);

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = 'Logged ' + timeAgo(clip.created);
  card.appendChild(meta);

  if (clip.scheduledDate) {
    const schedTag = document.createElement('div');
    schedTag.className = 'scheduled-tag';
    schedTag.textContent = '📅 Scheduled for ' + formatDateLong(clip.scheduledDate);
    card.appendChild(schedTag);
  }

  if (!clip.platform) clip.platform = 'Both';
  const platformRow = document.createElement('div');
  platformRow.className = 'platform-row';
  PLATFORMS.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'platform-chip' + (clip.platform === p ? ' selected' : '');
    chip.textContent = p;
    chip.onclick = () => { setPlatform(clip.id, p); refreshOpenModal(); };
    platformRow.appendChild(chip);
  });
  card.appendChild(platformRow);

  if (!clip.selectedTones) clip.selectedTones = ['Deadpan nature-doc'];
  const toneRow = document.createElement('div');
  toneRow.className = 'tone-row';
  TONES.forEach(tone => {
    const chip = document.createElement('div');
    chip.className = 'tone-chip' + (clip.selectedTones.includes(tone) ? ' selected' : '');
    chip.textContent = tone;
    chip.onclick = () => { toggleTone(clip.id, tone); refreshOpenModal(); };
    toneRow.appendChild(chip);
  });
  card.appendChild(toneRow);

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const select = document.createElement('select');
  STATUSES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = STATUS_LABELS[s];
    if (s === clip.status) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = () => { updateStatus(clip.id, select.value); refreshOpenModal(); };
  actions.appendChild(select);

  const dateRow = document.createElement('div');
  dateRow.className = 'date-picker-row';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = clip.scheduledDate || '';
  dateInput.onchange = () => { setScheduledDate(clip.id, dateInput.value); refreshOpenModal(); };
  dateRow.appendChild(dateInput);
  actions.appendChild(dateRow);

  const genBtn = document.createElement('button');
  genBtn.className = 'ghost';
  genBtn.textContent = loadingCaptions[clip.id] ? 'Writing' : (clip.captions ? 'Regenerate captions' : 'Generate captions');
  if (loadingCaptions[clip.id]) {
    genBtn.disabled = true;
    genBtn.innerHTML = 'Writing<span class="loading-dots"></span>';
  }
  genBtn.onclick = () => generateCaptions(clip.id);
  actions.appendChild(genBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'remove-btn';
  delBtn.textContent = 'Remove';
  delBtn.onclick = () => { removeClip(clip.id); closeCardModal(); };
  actions.appendChild(delBtn);

  card.appendChild(actions);

  if (clip.captions) {
    const box = document.createElement('div');
    box.className = 'captions-box';

    if (clip.captions.hook) {
      const hookP = document.createElement('div');
      hookP.className = 'hook-line';
      hookP.textContent = '"' + clip.captions.hook + '"';
      box.appendChild(hookP);
    }

    const usedTones = clip.captionTones || [];
    (clip.captions.captions || []).forEach((cap, i) => {
      const optDiv = document.createElement('div');
      optDiv.className = 'caption-opt';
      const tag = document.createElement('span');
      tag.className = 'copy-tag';
      const label = usedTones[i] ? usedTones[i] + ' — tap to copy' : 'Option ' + (i+1) + ' — tap to copy';
      tag.textContent = label;
      tag.onclick = () => copyText(cap, tag);
      optDiv.appendChild(tag);
      const capText = document.createElement('div');
      capText.textContent = cap;
      optDiv.appendChild(capText);
      box.appendChild(optDiv);
    });

    if (clip.captions.hashtags) {
      const hashDiv = document.createElement('div');
      hashDiv.className = 'hashtags';
      hashDiv.textContent = clip.captions.hashtags;
      box.appendChild(hashDiv);
    }

    card.appendChild(box);
  }

  return card;
}

function buildGridTile(clip) {
  const tile = document.createElement('div');
  tile.className = 'grid-tile';
  tile.setAttribute('data-highlight-id', clip.id);

  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + clip.status;
  stamp.textContent = STATUS_LABELS[clip.status];
  tile.appendChild(stamp);

  const desc = document.createElement('div');
  desc.className = 'grid-tile-desc';
  if (clip.captions && clip.captions.captions && clip.captions.captions[0]) {
    desc.textContent = clip.captions.captions[0];
  } else {
    desc.textContent = clip.desc;
  }
  tile.appendChild(desc);

  const footer = document.createElement('div');
  footer.className = 'grid-tile-footer';
  if (clip.scheduledDate) {
    footer.textContent = '📅 ' + formatDateLong(clip.scheduledDate);
  } else if (clip.captions) {
    footer.textContent = '💬 tap to see all captions';
  } else {
    footer.textContent = timeAgo(clip.created);
  }
  tile.appendChild(footer);

  tile.onclick = () => openCardModal(clip.id);
  return tile;
}

function openCardModal(id) {
  const overlay = document.getElementById('cardModalOverlay');
  const box = document.getElementById('cardModalBox');
  box.innerHTML = '';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = closeCardModal;
  box.appendChild(closeBtn);

  const clip = clips.find(c => c.id === id);
  if (clip) box.appendChild(buildFullCard(clip));

  overlay.classList.add('open');
  overlay.dataset.clipId = id;
}

function closeCardModal() {
  document.getElementById('cardModalOverlay').classList.remove('open');
  document.getElementById('cardModalOverlay').removeAttribute('data-clip-id');
}

function refreshOpenModal() {
  const overlay = document.getElementById('cardModalOverlay');
  if (overlay.classList.contains('open') && overlay.dataset.clipId) {
    openCardModal(overlay.dataset.clipId);
  }
}

document.getElementById('cardModalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'cardModalOverlay') closeCardModal();
});

const VIEW_META = {
  log: { label: 'Log view', icon: '📋' },
  grid: { label: 'Grid view', icon: '▦' },
  calendar: { label: 'Calendar view', icon: '📅' }
};

function render() {
  const toggle = document.getElementById('viewToggle');
  toggle.innerHTML = '';
  ['log','grid','calendar'].forEach(v => {
    const btn = document.createElement('button');
    btn.textContent = VIEW_META[v].label;
    btn.className = currentView === v ? 'active' : '';
    btn.onclick = () => { currentView = v; render(); };
    toggle.appendChild(btn);
  });
  renderBottomTabs();

  const showList = currentView === 'log' || currentView === 'grid';
  document.getElementById('cardList').style.display = showList ? (currentView === 'grid' ? 'grid' : 'block') : 'none';
  document.getElementById('cardList').className = currentView === 'grid' ? 'cardlist-grid' : '';
  document.getElementById('calendarView').style.display = currentView === 'calendar' ? 'block' : 'none';
  document.getElementById('filterRow').style.display = showList ? 'flex' : 'none';

  if (currentView === 'calendar') {
    renderCalendar();
    renderTally();
    refreshOpenModal();
    return;
  }

  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = 'All (' + clips.length + ')';
  allBtn.className = activeFilter === 'all' ? 'active' : '';
  allBtn.onclick = () => { activeFilter = 'all'; render(); };
  filterRow.appendChild(allBtn);
  STATUSES.forEach(s => {
    const count = clips.filter(c => c.status === s).length;
    const btn = document.createElement('button');
    btn.textContent = STATUS_LABELS[s] + ' (' + count + ')';
    btn.className = activeFilter === s ? 'active' : '';
    btn.onclick = () => { activeFilter = s; render(); };
    filterRow.appendChild(btn);
  });

  const list = document.getElementById('cardList');
  list.innerHTML = '';
  const filtered = activeFilter === 'all' ? clips : clips.filter(c => c.status === activeFilter);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No specimens logged yet. The field is quiet.</div>';
  } else {
    filtered.forEach(clip => {
      const node = currentView === 'grid' ? buildGridTile(clip) : buildFullCard(clip);
      list.appendChild(node);
    });
  }

  document.getElementById('catalogNum').textContent = 'No. ' + String(clips.length).padStart(3, '0');
  renderTally();
  refreshOpenModal();
}

function renderBottomTabs() {
  const bar = document.getElementById('bottomTabBar');
  if (!bar) return;
  bar.innerHTML = '';
  ['log','calendar'].forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'bottom-tab' + (currentView === v ? ' active' : '');
    btn.innerHTML = '<span class="bottom-tab-icon">' + VIEW_META[v].icon + '</span><span class="bottom-tab-label">' + (v === 'log' ? 'Log' : 'Calendar') + '</span>';
    btn.onclick = () => { currentView = v; render(); };
    bar.appendChild(btn);
  });
}

function renderTally() {
  document.getElementById('catalogNum').textContent = 'No. ' + String(clips.length).padStart(3, '0');
  const posted = clips.filter(c => c.status === 'posted').length;
  const pending = clips.length - posted;
  document.getElementById('tally').innerHTML =
    '<span>' + pending + ' pending in the field</span><span>' + posted + ' catalogued (posted)</span>';
}

function renderCalendar() {
  const container = document.getElementById('calendarView');
  const now = new Date();
  const viewDate = new Date(now.getFullYear(), now.getMonth() + calMonthOffset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthLabel = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('-');

  const clipsByDate = {};
  clips.forEach(c => {
    if (c.scheduledDate) {
      if (!clipsByDate[c.scheduledDate]) clipsByDate[c.scheduledDate] = [];
      clipsByDate[c.scheduledDate].push(c);
    }
  });

  let html = '<div class="cal-header">';
  html += '<h2>' + monthLabel + '</h2>';
  html += '<div class="nav-btns"><button id="calPrev">‹ Prev</button><button id="calToday">Today</button><button id="calNext">Next ›</button></div>';
  html += '</div>';
  html += '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += '<div class="cal-dow">' + d + '</div>'; });

  for (let i = 0; i < firstDow; i++) {
    html += '<div class="cal-cell empty"></div>';
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const isToday = dateStr === todayStr;
    html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
    html += '<div class="cal-daynum">' + day + '</div>';
    (clipsByDate[dateStr] || []).forEach(c => {
      html += '<div class="cal-post ' + c.status + '" data-clip-id="' + c.id + '" title="' + c.desc.replace(/"/g,'&quot;') + '">' + c.desc + '</div>';
    });
    html += '</div>';
  }

  const totalCells = firstDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) {
    html += '<div class="cal-cell empty"></div>';
  }
  html += '</div>';

  container.innerHTML = html;

  document.getElementById('calPrev').onclick = () => { calMonthOffset--; renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonthOffset++; renderCalendar(); };
  document.getElementById('calToday').onclick = () => { calMonthOffset = 0; renderCalendar(); };

  container.querySelectorAll('.cal-post').forEach(el => {
    el.onclick = () => openCardModal(el.dataset.clipId);
  });
}

document.getElementById('addBtn').addEventListener('click', addClip);
document.getElementById('fabAddBtn').addEventListener('click', openEntrySheet);
document.getElementById('sheetCloseBtn').addEventListener('click', closeEntrySheet);
document.getElementById('sheetBackdrop').addEventListener('click', closeEntrySheet);
document.getElementById('descInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.metaKey) addClip();
});

function loadTheme() {
  let saved = 'berry';
  try {
    saved = localStorage.getItem('ttt-theme') || 'berry';
  } catch (e) {}
  applyTheme(THEMES[saved] ? saved : 'berry', true);
}

renderNewClipTones();
renderNewClipPlatform();
loadTheme();
loadClips();
</script>
